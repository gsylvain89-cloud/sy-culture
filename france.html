<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>France Explorer</title>
<style>:root {
  --band: #0b3f94;
  --sea: #d7e4ec;
  --land: #ebede7;
  --ink: #16222e;
  --muted: #5a6876;
  --line: #d2dae0;
  --panel: #fbfbf9;
  --card: #ffffff;
  --plate: #0b3f94;
  --signal: #f2b705;
  --ok: #1e8a4c;
  --bad: #c43a2f;
  --river: #1f6fb4;
  --font: Bahnschrift, "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; display: grid; grid-template-rows: auto 1fr; overflow: hidden;
  font: 14px/1.45 var(--font); color: var(--ink); background: var(--panel);
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--plate); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------------------------------------------------------------- header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px; height: 52px; border-bottom: 1px solid var(--line); background: var(--card); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 6px; background: var(--plate); color: #fff; font-weight: 700; font-size: 15px; }
.brand h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: .005em; }
.top-right { display: flex; align-items: center; gap: 14px; }
.modes { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.modes button { border: 0; background: transparent; padding: 7px 18px; font-weight: 600; }
.modes button[aria-selected="true"] { background: var(--ink); color: #fff; }
.link { background: none; border: 0; padding: 0; color: var(--plate); text-decoration: underline; text-underline-offset: 2px; }

/* ----------------------------------------------------------------- stage */
.stage { display: grid; grid-template-columns: minmax(0, 1fr) 400px; min-height: 0; }
.mapwrap { position: relative; overflow: hidden; background: var(--sea); min-height: 0; }
svg.map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.mapwrap.panning svg.map { cursor: grabbing; }

/* map shapes */
.map .dept, .inset-svg .dept { fill: var(--c, var(--land)); stroke: #fff; stroke-width: .8px; cursor: pointer; fill-rule: evenodd; }
.mapwrap:not(.l-fill) .dept { fill: var(--land); }
body[data-mode="explore"] .mapwrap.l-deptLines .map .dept:hover { filter: brightness(.92); }
.map .dept.rh { filter: brightness(.9); }
.map .region-line.hot { stroke: #111c26; stroke-width: 3px; }
.map .region-line.hot-sel, .map .region-line.hot-target { stroke: #111c26; stroke-width: 3px; }
.map .region-line.hot-ok { stroke: var(--ok); stroke-width: 3.5px; }
.map .region-line.hot-bad { stroke: var(--bad); stroke-width: 3.5px; }
.mapwrap:not(.l-deptLines) .map .dept { stroke: none; }
.map .neigh-land { fill: var(--land); }
.map .neigh-border { fill: none; stroke: #b9c3c6; stroke-width: 1px; stroke-dasharray: 4 3; }
.map .cname { fill: #6f7c82; font-style: italic; letter-spacing: .12em; text-transform: uppercase; stroke: rgba(255,255,255,.4); stroke-width: .15em; }
.g-neigh { pointer-events: none; }
.map .river.major { stroke-width: 3.4px; }
.map .region-line { fill: none; stroke: #3b4957; stroke-width: 1.5px; stroke-linejoin: round; pointer-events: none; }
.map .wine-zone { fill: var(--wc); fill-opacity: .36; stroke: var(--wc); stroke-width: 1.6px; stroke-dasharray: 6 3; vector-effect: non-scaling-stroke; cursor: pointer; }
.map .wine-zone:hover { fill-opacity: .55; }
.map .river { fill: none; stroke: var(--river); stroke-width: 1.9px; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.map .river-hit { fill: none; stroke: transparent; stroke-width: 12px; pointer-events: stroke; cursor: pointer; vector-effect: non-scaling-stroke; }
.map .pref-dot { fill: #fff; stroke: var(--ink); stroke-width: 1.5px; vector-effect: non-scaling-stroke; cursor: pointer; }
.map .pref-dot.cap { fill: var(--signal); stroke-width: 2px; }
.map .app-dot { fill: var(--wc); stroke: #fff; stroke-width: 1.5px; vector-effect: non-scaling-stroke; cursor: pointer; }

.map text { pointer-events: none; paint-order: stroke; stroke-linejoin: round; font-family: var(--font); }
.map .num { fill: #1c2a37; font-weight: 650; stroke: rgba(255,255,255,.7); stroke-width: .24em; }
.map .pname { fill: #1b2733; stroke: rgba(255,255,255,.85); stroke-width: .28em; }
.map .pname.cap { font-weight: 700; }
.map .aname { fill: #4a1527; stroke: rgba(255,255,255,.85); stroke-width: .28em; }
.map .wname { fill: var(--wc); font-weight: 700; stroke: rgba(255,255,255,.9); stroke-width: .32em; }
.map .rname { fill: #12456f; font-style: italic; stroke: rgba(255,255,255,.85); stroke-width: .28em; }

/* layer switches */
.mapwrap:not(.l-regionLines) .g-regionLines,
.mapwrap:not(.l-nums) .g-nums,
.mapwrap:not(.l-prefs) .g-prefs,
.mapwrap:not(.l-prefNames) .g-prefNames,
.mapwrap:not(.l-rivers) .g-rivers,
.mapwrap:not(.l-riverNames) .g-riverNames,
.mapwrap:not(.l-wines) .g-wines,
.mapwrap:not(.l-wineNames) .g-wineNames,
.mapwrap:not(.l-apps) .g-apps,
.mapwrap:not(.l-appNames) .g-appNames { display: none; }

/* highlights */
.map .hl { fill: none; fill-rule: evenodd; pointer-events: none; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.map .hl-sel { stroke: var(--ink); stroke-width: 3px; fill: rgba(242,183,5,.30); }
.map .hl-regsel { stroke: var(--ink); stroke-width: 1.6px; fill: rgba(242,183,5,.26); }
.map .hl-target { stroke: var(--ink); stroke-width: 3px; fill: rgba(242,183,5,.62); }
.map .hl-regtarget { stroke: rgba(17,28,38,.35); stroke-width: 1px; fill: rgba(242,183,5,.55); }
.map .hl-regok { stroke: rgba(30,138,76,.5); stroke-width: 1px; fill: rgba(30,138,76,.40); }
.map .hl-regbad { stroke: rgba(196,58,47,.5); stroke-width: 1px; fill: rgba(196,58,47,.38); }
.mapwrap:not(.l-deptLines) .hl-regsel { stroke: none; }
.map .hl-dot.hl-reticle { fill: rgba(217,72,15,.18); stroke: #d9480f; stroke-width: 3px; stroke-dasharray: 5 3; }
.map .hl-ok { stroke: var(--ok); stroke-width: 3.5px; fill: rgba(30,138,76,.38); }
.map .hl-bad { stroke: var(--bad); stroke-width: 3.5px; fill: rgba(196,58,47,.36); }
.map .hl-river { fill: none; stroke-width: 8px; }
.map .hl-river.hl-sel, .map .hl-river.hl-target { stroke: rgba(242,183,5,.7); }
.map .hl-river.hl-ok { stroke: rgba(30,138,76,.7); }
.map .hl-river.hl-bad { stroke: rgba(196,58,47,.7); }
.map .hl-dot.hl-sel { fill: none; stroke-width: 2.5px; }
.map .hl-dot.hl-target { stroke-width: 2.5px; }

/* overlays on the map */
.toolbar { position: absolute; top: 12px; left: 12px; right: 64px; display: flex; flex-wrap: wrap; gap: 6px; }
.toolbar button { border: 1px solid rgba(22,34,46,.25); background: rgba(255,255,255,.93); border-radius: 6px; padding: 6px 12px; font-weight: 600; }
.toolbar button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.zoombtns { position: absolute; right: 12px; top: 12px; display: grid; gap: 4px; }
.zoombtns button { width: 38px; height: 38px; border: 1px solid rgba(22,34,46,.25); background: rgba(255,255,255,.95); border-radius: 6px; font-size: 20px; line-height: 1; }
.zoombtns button:hover, .toolbar button:not([aria-pressed="true"]):hover { background: #fff; }
.toolbar button[aria-pressed="true"]:hover { background: #24313d; }
.zoombtns button#zhome { font-size: 13px; font-weight: 700; }
.insets { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 8px; max-width: calc(100% - 24px); flex-wrap: wrap; }
body[data-mode="quiz"] .insets { display: none; }
.inset-tile { width: 92px; background: rgba(255,255,255,.82); border: 1px solid rgba(22,34,46,.2); border-radius: 6px; padding: 4px; }
.inset-svg { width: 100%; height: 56px; display: block; }
.inset-svg .dept:hover { filter: brightness(.92); }
.inset-svg .dept.hl-sel, .inset-svg .dept.hl-target { stroke: var(--ink); stroke-width: 2.5px; }
.inset-svg .dept.hl-ok { stroke: var(--ok); stroke-width: 3px; }
.inset-svg .dept.hl-bad { stroke: var(--bad); stroke-width: 3px; }
.inset-cap { font-size: 10.5px; line-height: 1.2; color: var(--ink); text-align: center; }
.inset-num { font-weight: 700; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--ink); color: #fff; border-radius: 6px; padding: 5px 9px; font-size: 13px; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
.tip .dim { opacity: .75; font-size: 12px; margin-top: 1px; }

.banner { position: absolute; z-index: 6; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(540px, calc(100% - 32px)); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; box-shadow: 0 10px 40px rgba(22,34,46,.22); }
.banner h3 { margin: 0 0 8px; font-size: 18px; }
.banner p { margin: 0 0 10px; }
.banner code { font-size: 12.5px; background: #eef1f4; padding: 1px 5px; border-radius: 4px; }
.banner.busy { top: 16px; transform: translateX(-50%); width: auto; padding: 8px 16px; border-radius: 999px; }
.banner.busy p { margin: 0; }
.banner-actions { display: flex; gap: 8px; margin: 14px 0 6px; }
.banner pre { white-space: pre-wrap; word-break: break-all; font-size: 11px; max-height: 120px; overflow: auto; background: #f3f5f7; padding: 8px; border-radius: 6px; }
.bad-note { color: var(--bad); font-size: 13px; }
.banner-inline { background: #fff4d6; border: 1px solid #ecd48a; border-radius: 8px; padding: 8px 12px; margin: 0 0 12px; }

/* ------------------------------------------------------------------ panel */
.panel { border-left: 1px solid var(--line); background: var(--panel); min-height: 0; display: flex; flex-direction: column; }
#explore, #quiz, #learn { display: flex; flex-direction: column; min-height: 0; flex: 1; padding: 14px 16px 10px; gap: 12px; }
#quiz, #learn { overflow-y: auto; }
.search input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); font: inherit; }
.search input:focus { border-color: var(--plate); outline: 2px solid rgba(11,63,148,.2); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.card.intro-card { background: transparent; border-style: dashed; }
.card h2, .intro h2 { margin: 0; font-size: 20px; line-height: 1.2; font-weight: 650; }
.card .sub { margin: 2px 0 0; color: var(--muted); }
.card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.intro p { margin: 6px 0 0; color: var(--muted); }
.facts { display: grid; grid-template-columns: 124px 1fr; gap: 5px 10px; margin: 0; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; }
.note { margin: 10px 0 0; color: var(--muted); }
.tag { display: inline-block; font-size: 12px; padding: 0 6px; border-radius: 4px; background: #fdf1c4; border: 1px solid #ecd48a; }
.swatch { width: 26px; height: 26px; border-radius: 6px; flex: none; border: 1px solid rgba(0,0,0,.12); }
.swatch.sm { width: 14px; height: 14px; border-radius: 4px; }
.swatch.river-sw { background: linear-gradient(135deg, #fff 0 38%, var(--river) 38% 62%, #fff 62%); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chip-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 4px 8px; }
.chip-btn:hover { border-color: var(--plate); }
.chip-btn.plain { border: 0; padding: 0; background: none; color: var(--plate); text-decoration: underline; text-underline-offset: 2px; }
.chip-btn.static { background: #f4f5f6; }

/* département number, styled like the strip on a French licence plate */
.plate { display: inline-flex; align-items: stretch; border: 2px solid #111; border-radius: 6px; overflow: hidden; background: #fff; line-height: 1; font-family: var(--font); flex: none; }
.plate-eu { background: var(--plate); color: #fff; font-size: 10px; font-weight: 700; padding: 0 5px 3px; display: flex; align-items: flex-end; }
.plate-n { font-weight: 700; font-size: 26px; padding: 4px 10px; min-width: 2.1ch; text-align: center; color: #111; letter-spacing: .02em; }
.plate.sm { border-width: 1.5px; border-radius: 4px; }
.plate.sm .plate-eu { font-size: 7px; padding: 0 3px 2px; }
.plate.sm .plate-n { font-size: 14px; padding: 2px 6px; min-width: 2.4ch; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 7px 10px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 600; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--plate); }
.list { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -6px; padding: 0 6px; }
.li { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid #ecf0f2; padding: 7px 8px; }
.li:hover { background: #f1f4f6; }
.li.on { background: #e8eff8; box-shadow: inset 3px 0 0 var(--plate); }
.li-main { display: flex; align-items: center; gap: 10px; min-width: 0; }
.li-sub { color: var(--muted); font-size: 13px; text-align: right; }
.kind { font-size: 12px; color: var(--muted); min-width: 84px; }
.empty { color: var(--muted); padding: 12px 4px; }
.credit { margin: 0; font-size: 12px; color: var(--muted); }

/* ------------------------------------------------------------------- quiz */
#quiz h3 { margin: 14px 0 6px; font-size: 14px; font-weight: 650; }
.qz-opts { display: grid; gap: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.qz-opts .lbl { display: block; color: var(--muted); font-size: 13px; margin-bottom: 4px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: #fff; }
.seg button { border: 0; background: none; padding: 5px 14px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.chk { display: flex; gap: 8px; align-items: center; }
.qz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.qz-card { position: relative; display: grid; align-content: start; gap: 3px; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 10px 11px; }
.qz-card:hover:not(:disabled) { border-color: var(--plate); }
.qz-card:disabled { opacity: .5; cursor: not-allowed; }
.qz-card b { font-weight: 650; }
.qz-card span { color: var(--muted); font-size: 12.5px; line-height: 1.3; }
.qz-card small { color: var(--muted); font-size: 12px; }
.mastery { display: block; height: 4px; border-radius: 2px; background: #e6eaed; overflow: hidden; margin-top: 4px; }
.mastery i { display: block; height: 100%; background: var(--ok); }
.qz-foot { color: var(--muted); font-size: 12.5px; margin: 14px 0 0; }

#qz-play, #qz-end { display: flex; flex-direction: column; gap: 12px; }
.qz-head { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; }
.qz-bar { height: 4px; background: #e6eaed; border-radius: 2px; overflow: hidden; }
.qz-bar i { display: block; height: 100%; background: var(--plate); transition: width .25s; }
.qz-prompt { font-size: 19px; line-height: 1.5; margin: 6px 0 2px; }
.qz-prompt .plate { vertical-align: middle; margin: 0 2px; }
.qz-prompt b { font-weight: 700; }
.qz-hint { color: var(--muted); margin: 0; }
.qz-answers { display: grid; gap: 8px; }
.qz-choice { display: flex; align-items: center; gap: 12px; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 15px; }
.qz-choice:hover:not(:disabled) { border-color: var(--plate); background: #f5f8fc; }
.qz-choice kbd { font: 600 12px var(--font); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; background: #f4f6f8; }
.qz-choice.correct { background: #e5f4ea; border-color: var(--ok); }
.qz-choice.wrong { background: #fbe8e6; border-color: var(--bad); }
.qz-choice:disabled { cursor: default; color: var(--ink); }
.qz-form { display: flex; gap: 8px; }
.qz-form input { flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 15px; }
.qz-form input.correct { border-color: var(--ok); background: #e5f4ea; }
.qz-form input.wrong { border-color: var(--bad); background: #fbe8e6; }
.qz-feedback { min-height: 64px; }
.fb { margin: 0 0 6px; font-weight: 650; }
.fb.ok { color: var(--ok); }
.fb.bad { color: var(--bad); font-weight: 500; }
.fb.bad b { font-weight: 700; }
.fact { margin: 0; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.qz-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 8px 16px; font-weight: 600; }
.btn:hover:not(:disabled) { border-color: var(--plate); }
.btn.primary { background: var(--plate); border-color: var(--plate); color: #fff; }
.btn.primary:hover:not(:disabled) { background: #08306f; }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn:disabled { opacity: .45; cursor: default; }
#qz-end h2 { margin: 0; font-size: 22px; }
.big { font-size: 56px; font-weight: 700; line-height: 1; margin: 0; }
.big span { font-size: 20px; font-weight: 500; color: var(--muted); }
.qz-sum { margin: 0; color: var(--muted); }
.missed { margin: 0; padding-left: 18px; columns: 2; }

/* ---------------------------------------------------------------- small */
@media (max-width: 900px) {
  body { overflow: auto; }
  .stage { grid-template-columns: 1fr; grid-template-rows: 62vh auto; }
  .panel { border-left: 0; border-top: 1px solid var(--line); }
  .list { max-height: 50vh; }
}
@media (prefers-reduced-motion: reduce) { .qz-bar i { transition: none; } }

.grapes { display: flex; flex-wrap: wrap; gap: 2px 10px; }
.grape { color: var(--plate, inherit); text-decoration: underline; text-underline-offset: 2px; }
.grape:hover { text-decoration-thickness: 2px; }
.sub-h { font-size: 13px; margin: 14px 0 0; color: var(--muted); font-weight: 600; }
.chips.tight { margin-top: 6px; }

/* quiz : catégories bien visibles */
.qz-group { margin-top: 18px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--g) 30%, #fff); background: color-mix(in srgb, var(--g) 6%, #fff); overflow: hidden; }
.qz-ghead { display: flex; align-items: center; gap: 12px; padding: 11px 14px; background: var(--g); color: #fff; }
.qz-ghead h3 { margin: 0; font-size: 17px; letter-spacing: .01em; color: #fff; }
.qz-ghead small { display: block; opacity: .85; font-size: 12.5px; }
.qz-gicon { font-size: 24px; line-height: 1; }
.qz-gcount { margin-left: auto; font-size: 12px; background: rgba(255,255,255,.2); border-radius: 999px; padding: 2px 10px; }
.qz-group .qz-grid { padding: 10px; }
.qz-group .qz-card { border-left: 4px solid var(--g); }
.qz-group .qz-card:hover:not(:disabled) { border-color: var(--g); }
.qz-group .mastery i { background: var(--g); }
.qz-tag { position: absolute; top: 8px; right: 8px; font-style: normal; font-size: 11px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); background: #f1f3f5; border-radius: 4px; padding: 1px 6px; }
.qz-tag.map { color: #fff; background: var(--g); }
.qz-card b { padding-right: 52px; }
.qz-cat { align-self: flex-start; font-size: 13px; font-weight: 600; color: #fff; background: var(--g); border-radius: 999px; padding: 4px 12px; }
.qz-cat em { font-style: normal; opacity: .85; font-weight: 500; }
.qz-aside { font-size: 13px; font-weight: 500; color: #d9480f; }
body[data-mode="quiz"] .map .pref-dot { stroke-width: 12px; stroke: rgba(11,63,148,.22); paint-order: stroke; }

/* ---------- quiz : carte neutre, mises en évidence franches ---------- */
body[data-mode="quiz"] .map .dept, body[data-mode="quiz"] .paris-svg .dept { fill: #e8e3d8; }
body[data-mode="quiz"] .map .dept:hover, body[data-mode="quiz"] .paris-svg .dept:hover { fill: #d6cfbf; }
body[data-mode="quiz"] .map .dept.rh { fill: #d6cfbf; filter: none; }
body[data-mode="quiz"] .map .region-line { stroke: #6b7782; }
.map .hl-target { stroke: #111c26; stroke-width: 3px; fill: rgba(255,196,0,.88); }
.map .hl-regtarget { stroke: rgba(17,28,38,.3); stroke-width: 1px; fill: rgba(255,196,0,.88); }
.map .hl-ok { stroke: #11603a; stroke-width: 3px; fill: rgba(39,160,95,.85); }
.map .hl-bad { stroke: #8f1d16; stroke-width: 3px; fill: rgba(214,69,62,.85); }
.map .hl-regok { stroke: rgba(17,96,58,.4); stroke-width: 1px; fill: rgba(39,160,95,.85); }

<header class="top">

  </aside>
</main>

/* ===== geo.js ===== */
/* geo.js — projection, geometry helpers, text normalisation. Pure functions, no DOM. */
const GEO = (() => {
  const RAD = Math.PI / 180, R = 6371;

  /* Lambert conformal conic, the projection used for official maps of France.
     Standard parallels 44° and 49°, origin 46.5°N 3°E. Output in km, y pointing down (SVG). */
  const p1 = 44 * RAD, p2 = 49 * RAD, p0 = 46.5 * RAD, l0 = 3 * RAD;
  const n = Math.log(Math.cos(p1) / Math.cos(p2)) /
            Math.log(Math.tan(Math.PI / 4 + p2 / 2) / Math.tan(Math.PI / 4 + p1 / 2));
  const F = Math.cos(p1) * Math.pow(Math.tan(Math.PI / 4 + p1 / 2), n) / n;
  const rho = p => R * F / Math.pow(Math.tan(Math.PI / 4 + p / 2), n);
  const rho0 = rho(p0);

  function project(lat, lon) {
    const r = rho(lat * RAD), th = n * (lon * RAD - l0);
    return [r * Math.sin(th), r * Math.cos(th) - rho0];
  }

  const f1 = v => (Math.round(v * 10) / 10).toString();

  function emptyBox() { return { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity }; }
  function grow(b, x, y) {
    if (x < b.x0) b.x0 = x; if (x > b.x1) b.x1 = x;
    if (y < b.y0) b.y0 = y; if (y > b.y1) b.y1 = y;
  }
  function unionBox(a, b) {
    return { x0: Math.min(a.x0, b.x0), y0: Math.min(a.y0, b.y0), x1: Math.max(a.x1, b.x1), y1: Math.max(a.y1, b.y1) };
  }

  /* Signed area and centroid of a projected ring [[x,y],...] */
  function ringStats(pts) {
    let a = 0, cx = 0, cy = 0;
    for (let i = 0, m = pts.length; i < m; i++) {
      const [x0, y0] = pts[i], [x1, y1] = pts[(i + 1) % m];
      const c = x0 * y1 - x1 * y0;
      a += c; cx += (x0 + x1) * c; cy += (y0 + y1) * c;
    }
    a /= 2;
    if (Math.abs(a) < 1e-9) return { area: 0, cx: pts[0][0], cy: pts[0][1] };
    return { area: Math.abs(a), cx: cx / (6 * a), cy: cy / (6 * a) };
  }

  /* Turn a GeoJSON geometry (lon,lat order) into an SVG path in projected km.
     proj(lat, lon) -> [x, y]. Returns { d, box, cent, rings } */
  function shapeFromGeometry(geom, proj) {
    proj = proj || project;
    const polys = !geom ? [] : geom.type === 'Polygon' ? [geom.coordinates]
                : geom.type === 'MultiPolygon' ? geom.coordinates : [];
    const box = emptyBox();
    let d = '', best = null;
    const rings = [];
    for (const poly of polys) {
      poly.forEach((ring, ri) => {
        const pts = ring.map(c => proj(c[1], c[0]));
        pts.forEach(p => grow(box, p[0], p[1]));
        d += pts.map((p, i) => (i ? 'L' : 'M') + f1(p[0]) + ' ' + f1(p[1])).join('') + 'Z';
        if (ri === 0) {
          rings.push(pts);
          const st = ringStats(pts);
          if (!best || st.area > best.area) best = st;
        }
      });
    }
    if (!best) return null;
    return { d, box, cent: [best.cx, best.cy], rings };
  }

  /* Even-odd point-in-ring test (outer rings only). */
  function pointInRing(x, y, pts) {
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  }
  function pointInShape(x, y, shape) { return shape.rings.some(r => pointInRing(x, y, r)); }

  /* Catmull-Rom spline through projected points -> cubic Bézier SVG path */
  function smoothPath(pts) {
    if (pts.length < 2) return '';
    let d = 'M' + f1(pts[0][0]) + ' ' + f1(pts[0][1]);
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i - 1] || pts[i], b = pts[i], c = pts[i + 1], e = pts[i + 2] || c;
      const c1 = [b[0] + (c[0] - a[0]) / 6, b[1] + (c[1] - a[1]) / 6];
      const c2 = [c[0] - (e[0] - b[0]) / 6, c[1] - (e[1] - b[1]) / 6];
      d += 'C' + f1(c1[0]) + ' ' + f1(c1[1]) + ' ' + f1(c2[0]) + ' ' + f1(c2[1]) + ' ' + f1(c[0]) + ' ' + f1(c[1]);
    }
    return d;
  }

  /* Simple closed polygon path from projected points */
  function polyPath(pts) {
    return pts.map((p, i) => (i ? 'L' : 'M') + f1(p[0]) + ' ' + f1(p[1])).join('') + 'Z';
  }

  /* Fit a GeoJSON geometry into a w×h box with an equirectangular projection (for overseas insets). */
  function fitGeometry(geom, w, h, pad) {
    pad = pad == null ? 4 : pad;
    const polys = geom.type === 'Polygon' ? [geom.coordinates] : geom.coordinates;
    let lat0 = 0, n0 = 0;
    polys.forEach(p => p[0].forEach(c => { lat0 += c[1]; n0++; }));
    const kx = Math.cos((lat0 / n0) * RAD);
    const box = emptyBox();
    polys.forEach(p => p[0].forEach(c => grow(box, c[0] * kx, -c[1])));
    const s = Math.min((w - 2 * pad) / (box.x1 - box.x0), (h - 2 * pad) / (box.y1 - box.y0));
    const ox = (w - s * (box.x1 - box.x0)) / 2 - s * box.x0;
    const oy = (h - s * (box.y1 - box.y0)) / 2 - s * box.y0;
    let d = '';
    polys.forEach(poly => poly.forEach(ring => {
      d += ring.map((c, i) => (i ? 'L' : 'M') + f1(c[0] * kx * s + ox) + ' ' + f1(-c[1] * s + oy)).join('') + 'Z';
    }));
    return d;
  }

  /* Text normalisation for accent-, case- and punctuation-insensitive answers */
  function norm(s) {
    return String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[’'`´]/g, '').replace(/œ/g, 'oe').replace(/æ/g, 'ae')
      .replace(/[^a-z0-9]+/g, ' ').trim()
      .replace(/\bst\b/g, 'saint').replace(/\bste\b/g, 'sainte');
  }

  return { project, shapeFromGeometry, pointInShape, pointInRing, smoothPath, polyPath, fitGeometry,
           emptyBox, grow, unionBox, norm, ringStats, f1 };
})();

if (typeof module !== 'undefined') module.exports = GEO;

/* ===== loader.js ===== */
/* loader.js — gets département / région boundaries: cache first, then network, then manual file drop. */
const LOADER = (() => {
  const BASES = [
    'https://cdn.jsdelivr.net/gh/gregoiredavid/france-geojson@master/',
    'https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/'
  ];
  const FILES = {
    depts:    ['departements-version-simplifiee.geojson', 'departements.geojson'],
    regions:  ['regions-version-simplifiee.geojson', 'regions.geojson'],
    overseas: ['departements-avec-outre-mer.geojson']
  };
  const DROM = ['971', '972', '973', '974', '976'];

  /* ---------- IndexedDB cache (silently skipped if unavailable) ---------- */
  function openDb() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('france-explorer', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('geo');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  async function cacheGet(key) {
    try {
      const db = await openDb();
      return await new Promise((res, rej) => {
        const q = db.transaction('geo').objectStore('geo').get(key);
        q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
      });
    } catch (e) { return undefined; }
  }
  async function cachePut(key, val) {
    try {
      const db = await openDb();
      await new Promise((res, rej) => {
        const t = db.transaction('geo', 'readwrite'); t.objectStore('geo').put(val, key);
        t.oncomplete = res; t.onerror = () => rej(t.error);
      });
    } catch (e) { /* cache is optional */ }
  }
  async function cacheClear() {
    try {
      const db = await openDb();
      await new Promise(res => { const t = db.transaction('geo', 'readwrite'); t.objectStore('geo').clear(); t.oncomplete = res; t.onerror = res; });
    } catch (e) { /* ignore */ }
  }

  /* ---------- helpers ---------- */
  const CODE_KEYS = ['code', 'code_insee', 'CODE_DEPT', 'INSEE_DEP', 'insee_dep', 'dep', 'DEP', 'code_dept', 'codeDepartement'];
  const NAME_KEYS = ['nom', 'NOM', 'name', 'NOM_DEPT', 'nom_dept', 'libelle'];
  const pick = (props, keys) => { for (const k of keys) if (props && props[k] != null) return String(props[k]); return ''; };

  /* GeoJSON -> [{ code, name, geometry }] */
  function features(gj) {
    if (!gj || !Array.isArray(gj.features)) return [];
    return gj.features.map(f => ({
      code: pick(f.properties, CODE_KEYS).toUpperCase(),
      name: pick(f.properties, NAME_KEYS),
      geometry: f.geometry
    })).filter(f => f.geometry);
  }

  async function fetchJson(url, ms) {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), ms);
    try {
      const r = await fetch(url, { signal: ctl.signal });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const gj = await r.json();
      if (!gj || !Array.isArray(gj.features) || !gj.features.length) throw new Error('GeoJSON invalide');
      return gj;
    } finally { clearTimeout(timer); }
  }

  /* Try every base × file name until one works. Returns { data, tried } */
  async function fetchFirst(kind, errors) {
    for (const file of FILES[kind]) {
      for (const base of BASES) {
        try { return await fetchJson(base + file, 25000); }
        catch (e) { errors.push(base + file + ' — ' + (e.name === 'AbortError' ? 'délai dépassé' : e.message)); }
      }
    }
    return null;
  }

  /* Decide what a dropped file contains */
  function classify(gj) {
    const fs = features(gj);
    if (!fs.length) return null;
    if (fs.length <= 20) return 'regions';
    const codes = fs.map(f => f.code);
    const metro = codes.filter(c => /^(\d{2}|2A|2B)$/.test(c)).length;
    if (metro >= 50) return 'depts';                       /* with or without the overseas ones */
    if (codes.some(c => DROM.includes(c))) return 'overseas';
    return 'depts';
  }

  /* ---------- public API ---------- */
  async function loadAll(onStatus) {
    const out = { depts: null, regions: null, overseas: null, errors: [], fromCache: false };
    out.depts = await cacheGet('depts');
    out.regions = await cacheGet('regions');
    out.overseas = await cacheGet('overseas');
    if (out.depts) { out.fromCache = true; }

    if (!out.depts) {
      onStatus && onStatus('Téléchargement des frontières des départements…');
      out.depts = await fetchFirst('depts', out.errors);
      if (out.depts) cachePut('depts', out.depts);
    }
    if (!out.regions) {
      onStatus && onStatus('Téléchargement des frontières des régions…');
      out.regions = await fetchFirst('regions', out.errors);

  }));

  const mergeQuiz = (a, b) => {
    const m = { stats: Object.assign({}, a.stats), opts: Object.assign({}, b.opts, a.opts) };
    Object.keys(b.stats || {}).forEach(k => { const x = m.stats[k], y = b.stats[k]; if (!x || (y[0] || 0) > (x[0] || 0)) m.stats[k] = y; });

  };

  const mergeLearn = (a, b) => {

    Object.keys(b.known || {}).forEach(k => { known[k] = Math.max((a.known || {})[k] || 0, b.known[k]); });
    Object.keys(b.gone || {}).forEach(k => { gone[k] = Math.max((a.gone || {})[k] || 0, b.gone[k]); });

      if (!r.ok) throw { code: 'http' };

      if (out !== txt) {
        const p = await api('/gists/' + cfg.gist, { method: 'PATCH', body: JSON.stringify({ files: { [FILE]: { content: out } } }) });

  }

  window.addEventListener('message', async e => {

    host.insertBefore(svg, host.firstChild);

    FR.RIVERS.forEach(r => index.push({ layer: 'river', id: r.id, kind: 'Cours d\'eau', label: r.name, sub: '≈ ' + km(r.km) + ' km', keys: [r.name] }));

    FR.APPELLATIONS.forEach((a, i) => index.push({ layer: 'app', id: String(i), kind: 'Appellation', label: a.name, sub: wineById[a.wine].name, keys: [a.name] }));
  }
  function search(q) {
    if (!index) buildIndex();
    const nq = GEO.norm(q); if (!nq) return [];
    const out = [];
    index.forEach(it => {
      let best = 9;
      it.keys.forEach(k => {
        const nk = GEO.norm(k);
        if (nk === nq) best = Math.min(best, 0); else if (nk.startsWith(nq)) best = Math.min(best, 1);
        else if (nk.split(' ').some(w => w.startsWith(nq))) best = Math.min(best, 2); else if (nq.length > 2 && nk.includes(nq)) best = Math.min(best, 3);
      });
      if (best < 9) out.push({ it, best });
    });
    const order = { dept: 0, pref: 1, region: 2, river: 3, wine: 4, app: 5 };
    out.sort((a, b) => a.best - b.best || order[a.it.layer] - order[b.it.layer] || a.it.label.localeCompare(b.it.label, 'fr'));
    return out.map(o => o.it).filter(it => !it.skipIfSame).slice(0, 40);
  }

  function renderList() {
    const host = $('list');
    document.querySelectorAll('#listtabs button').forEach(b => b.setAttribute('aria-selected', String(!query && b.dataset.tab === tab)));
    if (query) {
      const res = search(query);
      host.innerHTML = res.length
        ? res.map(it => '<button class="li" data-go="' + it.layer + ':' + esc(it.id) + '"><span class="li-main"><span class="kind">' + esc(it.kind) + '</span><span>' + esc(it.label) + '</span></span><span class="li-sub">' + esc(it.sub) + '</span></button>').join('')
        : '<p class="empty">Aucun résultat pour « ' + esc(query) + ' ». Essayez un numéro (63), un département, une ville, un cours d\'eau ou un vin.</p>';
      return;
    }
    host.innerHTML = listItems().map(([l, id]) => '<button class="li" data-go="' + l + ':' + esc(id) + '">' + itemHtml(l, id) + '</button>').join('');
    markList();
  }
  function markList() {
    document.querySelectorAll('#list .li').forEach(b => {
      const on = sel && b.dataset.go === sel.layer + ':' + sel.id;
      b.classList.toggle('on', !!on);
      if (on) b.scrollIntoView({ block: 'nearest' });
    });
  }

  /* ----------------------------------------------------------- sélection */
  function select(layer, id, opts) {
    opts = opts || {};
    const pref = layer === 'pref';
    if (pref) layer = 'dept';
    if (layer === 'dept' && !D[id]) return;
    sel = { layer, id, pref };
    if (opts.layerChip !== false) ensureChip(pref ? 'prefs' : CHIP_OF[layer]);
    if (!query) {
      const t = layer === 'app' ? 'wine' : layer;
      if (t !== tab) { tab = t; renderList(); }
    }
    show();
    if (opts.fly !== false) {
      const b = MAP.boxOf(layer, id);
      /* un zoom doux : la carte se recentre, sans se rapprocher de beaucoup */
      if (b) MAP.flyTo(b, layer === 'app' ? { gentle: true, zoom: 0.5 } : { gentle: true });
    }
  }
  function show() {
    MAP.clearHighlights();
    if (sel) {
      MAP.highlight(sel.layer, sel.id, 'sel');
      if (sel.layer === 'dept' && (sel.pref || chips.prefs)) MAP.highlight('pref', sel.id, 'sel');
    }
    renderCard();
    markList();
  }
  function clear() { sel = null; show(); }

  /* quand seules les régions sont affichées, un département « vaut » sa région */
  const regionOnly = () => chips.regions && !chips.depts;
  function onMapClick(layer, id) {
    if (!layer) { clear(); return; }
    if (layer === 'dept' && regionOnly() && D[id]) { select('region', D[id].region); return; }
    select(layer, id);
  }
  function onHover(layer, id) {
    MAP.setHot(layer === 'dept' && D[id] && regionOnly() ? D[id].region : null);
  }

  /* ------------------------------------------------------------ infobulle */
  function tooltipFor(layer, id) {
    if (layer === 'dept') {
      const d = D[id]; if (!d) return '';
      const r = FR.REGIONS[d.region];
      if (regionOnly()) return '<b>' + esc(r.name) + '</b><div class="dim">capitale : ' + esc(r.capital) + '</div>';
      return '<b>' + esc(d.code) + '</b> ' + esc(d.name) + '<div class="dim">' + esc(r.name) + '</div>';
    }
    if (layer === 'pref') { const d = D[id]; return d ? esc(d.pref) + ' <span class="dim">préfecture · ' + esc(d.name) + '</span>' : ''; }
    if (layer === 'river') return esc(riverById[id].name);
    if (layer === 'wine') return esc(wineById[id].name);
    if (layer === 'app') { const a = FR.APPELLATIONS[+id]; return esc(a.name) + ' <span class="dim">' + esc(wineById[a.wine].name) + '</span>'; }
    return '';
  }

  /* ------------------------------------------------------- initialisation */
  function init() {
    applyChips(); renderCard(); renderList();
    $('chips').addEventListener('click', e => {
      const b = e.target.closest('[data-chip]'); if (!b) return;
      chips[b.dataset.chip] = !chips[b.dataset.chip]; sel = null; applyChips(); show();
    });
    $('listtabs').addEventListener('click', e => {
      const b = e.target.closest('[data-tab]'); if (!b) return;
      tab = b.dataset.tab; query = ''; $('q').value = ''; renderList();
    });
    $('explore').addEventListener('click', e => {
      const b = e.target.closest('[data-go]'); if (!b) return;
      const s = b.dataset.go, i = s.indexOf(':');
      select(s.slice(0, i), s.slice(i + 1));
    });
    $('q').addEventListener('input', e => { query = e.target.value.trim(); renderList(); });
    $('q').addEventListener('keydown', e => {
      if (e.key === 'Enter' && query) {
        const first = search(query)[0];
        if (first) { select(first.layer, first.id); }
      } else if (e.key === 'Escape') { e.target.value = ''; query = ''; renderList(); }
    });
  }

  return { init, select, clear, onMapClick, onHover, tooltipFor, applyChips, show, plate, search,
           _state: () => ({ sel, tab, query, chips: { ...chips } }) };
})();

/* ===== learn.js ===== */
/* learn.js — mode « Apprendre » : un parcours guidé, du proche au lointain.
   Méthode : on part de ce qu'on connaît (son département, sa région), on avance région par région en petits paquets (≤ 7),
   on découvre carte en main, puis on se teste sans pénalité (voir la réponse → « je savais » / « à revoir »). Les quiz viennent après. */
const LEARN = (() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const D = {}; FR.DEPTS.forEach(d => { D[d.code] = d; });
  const KEY = 'sy-france-learn.v1';
  const order = c => c === '2A' ? '20a' : c === '2B' ? '20b' : c.padStart(3, '0');
  const METRO = FR.DEPTS.filter(d => !d.overseas).sort((a, b) => order(a.code).localeCompare(order(b.code)));
  const plate = (code, sm) => '<span class="plate' + (sm ? ' sm' : '') + '" role="img" aria-label="numéro ' + code + '"><span class="plate-eu" aria-hidden="true">F</span><span class="plate-n">' + code + '</span></span>';
  const dist = (a, b) => { const R = 6371, r = Math.PI / 180, dl = (b.lat - a.lat) * r, dn = (b.lon - a.lon) * r;
    const x = Math.sin(dl / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dn / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)); };
  let st = { home: '44', hmod: 0, known: {}, gone: {}, seen: {} };
  try { st = Object.assign(st, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) { /* ignoré */ }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { /* ignoré */ } if (window.KV) KV.soon(); };
  let cb = {}, steps = [], v = { screen: 'path' }, savedLayers = null;

  /* ------------------------------------------------------------ parcours */
  const TIPS = {
    '11': 'Paris (75) et la petite couronne : 92, 93, 94. La grande couronne : 77, 78, 91, 95.',
    '94': '2A (Corse-du-Sud) avant 2B (Haute-Corse) : l\'ordre alphabétique des deux anciens départements.',
    '53': 'Les quatre départements bretons : 22, 29, 35, 56.',
    '52': 'Cinq départements : 44, 49, 53, 72, 85.'
  };
  function buildSteps() {
    const home = D[st.home] || D['44'], out = [];
    const regs = Object.keys(FR.REGIONS).filter(c => METRO.some(d => d.region === c));
    const avg = c => { const ds = METRO.filter(d => d.region === c); return ds.reduce((s, d) => s + dist(home, d), 0) / ds.length; };
    regs.sort((a, b) => (a === home.region ? -1 : b === home.region ? 1 : avg(a) - avg(b)));
    regs.forEach(c => {
      const ds = METRO.filter(d => d.region === c).sort((a, b) => dist(home, a) - dist(home, b));
      const n = Math.ceil(ds.length / 7), size = Math.ceil(ds.length / n);
      for (let k = 0; k < n; k++) {
        const part = ds.slice(k * size, (k + 1) * size).sort((a, b) => order(a.code).localeCompare(order(b.code)));
        const r = FR.REGIONS[c], isHome = c === home.region && k === 0;
        out.push({ id: 'r' + c + '-' + k, title: (isHome ? 'Chez toi : ' : '') + r.name + (n > 1 ? ' (' + (k + 1) + '/' + n + ')' : ''), color: r.color,
          note: isHome ? 'On part de ce que tu connais déjà : ton département et ta région.' : (TIPS[c] || ('Capitale de région : ' + r.capital + '.')),
          items: part.map(d => ({ kind: 'dept', code: d.code })) });
      }
    });
    out.push({ id: 'om', title: 'Outre-mer', color: '#c8b8a0', note: 'Les numéros à trois chiffres : 971, 972, 973, 974, 976.', items: FR.DEPTS.filter(d => d.overseas).map(d => ({ kind: 'dept', code: d.code })) });
    out.push({ id: 'reg', title: 'Les 13 régions et leurs capitales', color: '#9db9dc', note: 'Pour finir : la grande carte des régions de métropole.',
      items: regs.map(c => ({ kind: 'region', code: c })) });
    steps = out;
  }
  const key = it => it.kind === 'region' ? 'R' + it.code : it.code;
  const progress = s => ({ n: s.items.length, known: s.items.filter(i => st.known[key(i)]).length, seen: s.items.filter(i => st.seen[key(i)] || st.known[key(i)]).length });

  /* --------------------------------------------------------------- carte */
  function boxUnion(items) {
    let b = null;
    items.forEach(it => { const x = it.kind === 'region' ? null : MAP.boxOf('dept', it.code); if (!x) return;
      b = b ? { x0: Math.min(b.x0, x.x0), y0: Math.min(b.y0, x.y0), x1: Math.max(b.x1, x.x1), y1: Math.max(b.y1, x.y1) } : { ...x }; });
    return b;
  }
  function paint(step, cur, hideNums) {
    MAP.clearHighlights();
    if (step) step.items.forEach(it => { if (it.kind === 'dept') MAP.highlight('dept', it.code, 'learnset'); else MAP.highlight('region', it.code, 'learnset'); });
    if (cur) { if (cur.kind === 'dept') MAP.highlight('dept', cur.code, 'target'); else MAP.highlight('region', cur.code, 'target'); }
    const l = Object.assign({}, savedLayers || MAP.getLayers());
    MAP.setLayers(hideNums ? Object.assign(l, { nums: false, prefs: false, prefNames: false }) : l);
  }
  function fly(it, step) {
    if (it && it.kind === 'dept' && !D[it.code].overseas) { const b = MAP.boxOf('dept', it.code); if (b) MAP.flyTo(b, { gentle: true, zoom: 0.45 }); }
    else if (it && it.kind === 'region') { const ds = METRO.filter(d => d.region === it.code).map(d => ({ kind: 'dept', code: d.code })); const b = boxUnion(ds); if (b) MAP.flyTo(b, { gentle: true, zoom: 0.4 }); }
    else if (step) { const b = boxUnion(step.items); if (b) MAP.flyTo(b, { gentle: true, zoom: 0.3 }); else MAP.flyTo(null); }
  }

  /* ---------------------------------------------------------------- vues */
  const root = () => $('learn');
  function itemCard(it) {
    if (it.kind === 'region') {
      const r = FR.REGIONS[it.code], ds = METRO.filter(d => d.region === it.code);
      return '<div class="card-head"><span class="swatch" style="background:' + r.color + '"></span><div><h2>' + esc(r.name) + '</h2><p class="sub">' + ds.length + ' départements</p></div></div>' +
        '<dl class="facts"><dt>Capitale</dt><dd>' + esc(r.capital) + '</dd><dt>Départements</dt><dd>' + ds.map(d => esc(d.code)).join(' · ') + '</dd></dl>';
    }
    const d = D[it.code], r = FR.REGIONS[d.region], i = METRO.findIndex(x => x.code === d.code);
    const pv = METRO[i - 1], nx = METRO[i + 1];
    return '<div class="card-head">' + plate(d.code) + '<div><h2>' + esc(d.name) + '</h2><p class="sub">' + esc(r.name) + '</p></div></div>' +
      '<dl class="facts"><dt>Préfecture</dt><dd>' + esc(d.pref) + (r.capital === d.pref && !d.overseas ? ' <span class="tag">capitale de région</span>' : '') + '</dd>' +
      (d.overseas ? '' : '<dt>Numéro</dt><dd class="seq">' + (pv ? esc(pv.code + ' ' + pv.name) + ' › ' : '') + '<b>' + esc(d.code) + '</b>' + (nx ? ' › ' + esc(nx.code + ' ' + nx.name) : '') + '</dd>') + '</dl>';
  }
  function pathView() {
    const tot = steps.reduce((s, x) => s + x.items.length, 0), kn = steps.reduce((s, x) => s + progress(x).known, 0);
    let h = '<div class="lr-intro"><h2>Apprendre la France</h2><p>On part de chez toi et on s\'éloigne petit à petit, région par région, par paquets de 7 au plus. Pour chaque étape : <b>découvre</b> carte en main, puis <b>réponds de tête</b> avant de voir la réponse. Les quiz viennent ensuite.</p>' +
      '<label class="lr-home">Mon département : <select id="lr-home">' + METRO.map(d => '<option value="' + d.code + '"' + (d.code === st.home ? ' selected' : '') + '>' + esc(d.code + ' ' + d.name) + '</option>').join('') + '</select></label>' +
      '<div class="lr-total"><i style="width:' + Math.round(100 * kn / tot) + '%"></i></div><p class="muted">' + kn + ' retenus sur ' + tot + '</p></div><div class="lr-steps">';
    steps.forEach((s, i) => { const p = progress(s);
      h += '<button class="lr-step' + (p.known === p.n ? ' done' : '') + '" data-lr="open:' + i + '"><span class="lr-no" style="background:' + s.color + '">' + (i + 1) + '</span><span class="lr-st"><b>' + esc(s.title) + '</b><small>' + p.n + (s.items[0].kind === 'region' ? ' régions' : ' départements') + ' · ' + p.known + ' retenus</small></span><span class="lr-go">›</span></button>'; });
    root().innerHTML = h + '</div>';
    const sel = $('lr-home'); if (sel) sel.onchange = () => { st.home = sel.value; st.hmod = Date.now(); save(); buildSteps(); pathView(); };
    paint(null, null, false); MAP.flyTo(null);
  }
  function stepHead(s, title2) {
    const p = progress(s);
    return '<div class="lr-top"><button class="link" data-lr="path">‹ Parcours</button><span class="lr-ttl">Étape ' + (v.idx + 1) + '/' + steps.length + ' · ' + esc(s.title) + '</span></div>' +
      '<div class="lr-ph"><button data-lr="phase:discover" aria-pressed="' + (v.phase === 'discover') + '">1 · Découvrir</button><button data-lr="phase:review" aria-pressed="' + (v.phase === 'review') + '">2 · Se tester</button></div>';
  }
  function discoverView() {
    const s = steps[v.idx], it = s.items[v.i], last = v.i === s.items.length - 1;
    st.seen[key(it)] = 1; save();
    root().innerHTML = stepHead(s) + '<p class="lr-note">' + esc(s.note) + '</p><div class="card lr-card">' + itemCard(it) + '</div>' +
      '<div class="lr-dots">' + s.items.map((x, k) => '<button class="' + (k === v.i ? 'on' : '') + (st.known[key(x)] ? ' ok' : '') + '" data-lr="go:' + k + '" aria-label="' + (x.kind === 'region' ? esc(FR.REGIONS[x.code].name) : esc(x.code)) + '">' + (x.kind === 'region' ? '' : esc(x.code)) + '</button>').join('') + '</div>' +
      '<div class="lr-nav"><button class="btn" data-lr="prev"' + (v.i ? '' : ' disabled') + '>‹ Précédent</button>' + (last ? '<button class="btn primary" data-lr="phase:review">Me tester ›</button>' : '<button class="btn primary" data-lr="next">Suivant ›</button>') + '</div>';
    paint(s, it, false); fly(it, s);
  }
  function startReview() {
    const s = steps[v.idx];
    v.queue = s.items.map(it => ({ it, dir: 0, tries: 0 })).sort(() => Math.random() - .5);
    v.queue.forEach((q, k) => { q.dir = k % 3; }); v.reveal = false; v.firstTry = 0; v.total = v.queue.length;
  }
  function reviewView() {
    const s = steps[v.idx];
    if (!v.queue.length) {
      const ok = v.firstTry, n = v.total, nxt = v.idx + 1 < steps.length;
      root().innerHTML = stepHead(s) + '<div class="card lr-card lr-end"><h2>' + (ok === n ? 'Sans faute !' : 'Étape terminée') + '</h2><p class="big">' + ok + ' <span>du premier coup sur ' + n + '</span></p>' +
        '<p class="muted">Les départements « à revoir » sont repassés jusqu\'à ce qu\'ils soient sus. Reviens les voir demain : c\'est comme ça qu\'on retient longtemps.</p></div>' +
        '<div class="lr-nav col"><button class="btn primary" data-lr="quiz">Faire un quiz</button>' + (nxt ? '<button class="btn" data-lr="open:' + (v.idx + 1) + '">Étape suivante ›</button>' : '') + '<button class="btn ghost" data-lr="phase:review">Recommencer le test</button><button class="link" data-lr="path">Retour au parcours</button></div>';
      paint(s, null, false); fly(null, s); return;
    }
    const q = v.queue[0], it = q.it, left = v.queue.length;
    let prompt, answer;
    if (it.kind === 'region') {
      const r = FR.REGIONS[it.code];
      if (q.dir === 1) { prompt = '<p class="lr-q">Capitale de la région</p><h3>' + esc(r.name) + ' ?</h3>'; answer = '<dl class="facts"><dt>Capitale</dt><dd>' + esc(r.capital) + '</dd></dl>'; }
      else { prompt = '<p class="lr-q">Quelle est cette région ? Et sa capitale ?</p><h3>(surlignée sur la carte)</h3>'; answer = '<div class="card-head"><span class="swatch" style="background:' + r.color + '"></span><div><h2>' + esc(r.name) + '</h2></div></div><dl class="facts"><dt>Capitale</dt><dd>' + esc(r.capital) + '</dd></dl>'; }
    } else {
      const d = D[it.code];
      if (q.dir === 0) { prompt = '<p class="lr-q">Quel département porte ce numéro ? Et sa préfecture ?</p><div class="lr-big">' + plate(d.code) + '</div>'; }
      else if (q.dir === 1) { prompt = '<p class="lr-q">Quel est le numéro de ce département ? Sa préfecture ?</p><h3>' + esc(d.name) + '</h3>'; }
      else { prompt = '<p class="lr-q">Quel est ce département (surligné sur la carte) ? Son numéro, sa préfecture ?</p>'; }
      answer = itemCard(it);
    }
    root().innerHTML = stepHead(s) + '<div class="lr-prog"><i style="width:' + Math.round(100 * (v.total - left) / v.total) + '%"></i></div>' +
      '<div class="card lr-card">' + prompt + (v.reveal ? '<div class="lr-ans">' + answer + '</div>' : '') + '</div>' +
      '<div class="lr-nav">' + (v.reveal ? '<button class="btn bad" data-lr="again">À revoir</button><button class="btn good primary" data-lr="knew">Je savais</button>' : '<button class="btn primary wide" data-lr="reveal">Voir la réponse</button>') + '</div>';
    const showAns = v.reveal || q.dir !== 2;
    paint(s, it, !v.reveal); fly(it, s);   /* avant la réponse : ni numéros ni préfectures sur la carte (ils la donneraient) */
  }
  function render() {
    if (v.screen === 'path') pathView();
    else if (v.phase === 'discover') discoverView();
    else reviewView();
    const r = root(); if (r.scrollTo) r.scrollTo(0, 0); const p = r.closest('.panel'); if (p) p.scrollTop = 0;
  }
  function act(a) {
    const [c, arg] = a.split(':');
    if (c === 'path') { v = { screen: 'path' }; }
    else if (c === 'open') { v = { screen: 'step', idx: +arg, phase: 'discover', i: 0 }; }
    else if (c === 'phase') { v.phase = arg; v.i = 0; if (arg === 'review') startReview(); }
    else if (c === 'go') v.i = +arg;
    else if (c === 'next') v.i = Math.min(steps[v.idx].items.length - 1, v.i + 1);
    else if (c === 'prev') v.i = Math.max(0, v.i - 1);
    else if (c === 'reveal') v.reveal = true;
    else if (c === 'knew' || c === 'again') {
      const q = v.queue.shift(), k = key(q.it);
      if (c === 'knew') { st.known[k] = Date.now(); delete st.gone[k]; if (!q.tries) v.firstTry++; }
      else { delete st.known[k]; st.gone[k] = Date.now(); q.tries++; q.dir = (q.dir + 1) % 3; if (q.tries < 3) v.queue.splice(Math.min(v.queue.length, 3), 0, q); }
      v.reveal = false; save();
    }
    else if (c === 'quiz') { if (cb.toQuiz) cb.toQuiz(); return; }
    render();
  }
  function onMapClick(layer, id) {
    if (v.screen !== 'step' || v.phase !== 'discover') return;
    const s = steps[v.idx]; let k = -1;
    if (layer === 'dept') k = s.items.findIndex(x => x.kind === 'dept' && x.code === id);
    if (layer === 'region') k = s.items.findIndex(x => x.kind === 'region' && x.code === id);
    if (k >= 0) { v.i = k; render(); }
  }

  function init(callbacks) {
    cb = callbacks || {}; buildSteps();
    KV.reg('learn', { get: () => st, merge: KV.mergeLearn, apply: o => { st = Object.assign({ home: '44', hmod: 0, known: {}, gone: {}, seen: {} }, o); try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { /* ignoré */ } buildSteps(); if (v.screen === 'path' && !root().hidden) pathView(); } });
    root().addEventListener('click', e => { const b = e.target.closest('[data-lr]'); if (b && !b.disabled) act(b.dataset.lr); });
  }

  function sample(pool, n, t) {

  /* via : 'choice' | 'type' | 'click' | 'skip' */
  function submit(raw, via) {
    const s = session; if (!s || s.answered) return;
    const q = s.q;
    let ok = false;
    if (via === 'type') ok = (q.accept || []).some(a => GEO.norm(a) === GEO.norm(raw));
    else if (via !== 'skip') ok = raw === q.answer;
    s.answered = true;
    record(s.t.id, q.id, ok);
    if (ok) { s.score++; s.streak++; s.best = Math.max(s.best, s.streak); } else { s.streak = 0; s.missed.push(q.id); }
    s.results.push({ id: q.id, ok, label: q.answerLabel });

    /* retour sur la carte */
    if (q.kind === 'click') {
      MAP.clearHighlights();
      (q.show || []).forEach(x => MAP.highlight(x.layer, x.id, 'sel'));
      if (!ok && via === 'click') MAP.highlight(q.clickLayer, raw, 'bad');
      MAP.highlight(q.target.layer, q.target.id, 'ok');
      if (!ok && q.target.layer === 'dept') viewFor(MAP.boxOf(q.target.layer, q.target.id));
    } else if (q.show) {
      MAP.clearHighlights();
      q.show.forEach(x => MAP.highlight(x.layer, x.id, ok ? 'ok' : 'bad'));
    }

    /* retour dans le panneau */
    document.querySelectorAll('#qz-play .qz-choice').forEach(b => {
      b.disabled = true;
      if (b.dataset.v === q.answer) b.classList.add('correct');
      else if (via === 'choice' && b.dataset.v === raw) b.classList.add('wrong');
    });
    const inp = $('qz-input'); if (inp) { inp.disabled = true; inp.classList.add(ok ? 'correct' : 'wrong'); }
    const sub = $('qz-form') && $('qz-form').querySelector('button'); if (sub) sub.disabled = true;
    $('qz-fb').innerHTML = (ok ? '<p class="fb ok">Bonne réponse</p>'
      : '<p class="fb bad">' + (via === 'skip' ? 'Question passée.' : 'Raté.') + ' La réponse est <b>' + q.answerLabel + '</b>.</p>') +
      '<p class="fact">' + q.fact + '</p>';
    $('qz-skip').disabled = true;
    const nb = $('qz-next'); nb.disabled = false; nb.focus();
    banner(ok ? '<span class="mark">✓</span> Bonne réponse : <b>' + q.answerLabel + '</b>'
              : '<span class="mark">✗</span> ' + (via === 'skip' ? 'Passée' : 'Raté') + ' : c\'était <b>' + q.answerLabel + '</b>', ok ? 'ok' : 'bad');
    /* bonne réponse : on enchaîne tout seul ; erreur : on laisse le temps de lire (Entrée ou Suivant) */
    if (ok && store.opts.auto !== false) s.auto = setTimeout(() => { if (session === s && s.answered) goNext(); }, 1300);
    s.i++;
    const head = document.querySelector('#qz-play .qz-head');
    if (head) head.innerHTML = '<span>Question ' + s.i + ' sur ' + s.items.length + '</span><span>Score : ' + s.score + '</span><span>Série : ' + s.streak + '</span>';
    const bar = document.querySelector('#qz-play .qz-bar i'); if (bar) bar.style.width = (100 * s.i / s.items.length) + '%';
  }

  function goNext() {
    const s = session; if (!s || !s.answered) return;
    clearTimeout(s.auto);
    if (s.i >= s.items.length) finish(); else next();
  }

  /* survol en quiz « carte » : on montre ce qui serait cliqué, sans le nommer */
  function onHover(layer, id) {
    const s = session, q = s && !s.answered && s.q;
    MAP.setHot(q && q.kind === 'click' && q.clickLayer === 'region' && layer === 'dept' ? MAP.regionOfDept(id) : null);
  }

  /* appelé par main quand on clique sur la carte en mode quiz */
  function onMapClick(layer, id) {
    const s = session; if (!s || s.answered || !s.q || s.q.kind !== 'click') return;
    let given = null;
    if (s.q.clickLayer === 'region') { if (layer === 'dept') given = MAP.regionOfDept(id); }
    else if (layer === s.q.clickLayer) given = id;
    if (given == null) return;
    submit(given, 'click');
  }

  function finish(early) {
    const s = session; if (!s) return;
    const answered = s.results.length, pct = answered ? Math.round(100 * s.score / answered) : 0;
    clearTimeout(s.auto);
    MAP.clearHighlights(); banner(null); MAP.flyTo(null);
    $('qz-end').innerHTML =
      '<h2>' + (early ? 'Quiz interrompu' : 'Quiz terminé') + '</h2>' +
      '<p class="big">' + s.score + ' <span>sur ' + answered + '</span></p>' +
      '<p class="qz-sum">' + pct + ' % de réussite · meilleure série : ' + s.best + '</p>' +
      (s.missed.length ? '<h3>À revoir</h3><ul class="missed">' + s.results.filter(r => !r.ok).map(r => '<li>' + r.label + '</li>').join('') + '</ul>' : '<p class="fb ok">Aucune erreur.</p>') +
      '<div class="qz-actions">' + (s.missed.length ? '<button class="btn primary" id="qz-again-missed">Retravailler les erreurs</button>' : '') +
      '<button class="btn' + (s.missed.length ? '' : ' primary') + '" id="qz-again">Rejouer</button><button class="btn ghost" id="qz-tomenu">Tous les quiz</button></div>';
    session.over = true;
    showScreen('end');
  }

  /* ---------------------------------------------------------------- menu */
  function masteryOf(t) {
    const pool = t.pool(); if (!pool.length) return { n: 0, known: 0 };
    return { n: pool.length, known: pool.filter(id => isKnown(t.id, id)).length };
  }
  function seg(name, label, opts, cur) {
    return '<div class="seg" role="group" aria-label="' + label + '">' + opts.map(o => '<button data-opt="' + name + '" data-val="' + o[0] + '" aria-pressed="' + (String(cur) === String(o[0])) + '">' + o[1] + '</button>').join('') + '</div>';
  }
  function renderMenu(msg) {
    session = null;
    const groups = [];
    TYPES.forEach(t => { if (!groups.includes(t.group)) groups.push(t.group); });
    let html = (msg ? '<p class="banner-inline">' + esc(msg) + '</p>' : '') +
      '<div class="qz-opts"><div><span class="lbl">Nombre de questions</span>' + seg('count', 'Nombre de questions', [[10, '10'], [20, '20'], [40, '40']], store.opts.count) + '</div>' +
      '<div><span class="lbl">Répondre en</span>' + seg('input', 'Mode de réponse', [['choice', 'choisissant'], ['type', 'tapant'], ['map', 'sur la carte']], store.opts.input) + '</div>' +
      '<label class="chk"><input type="checkbox" id="opt-overseas"' + (store.opts.overseas ? ' checked' : '') + '> Inclure l\'outre-mer (971–976)</label>' +
      '<label class="chk"><input type="checkbox" id="opt-auto"' + (store.opts.auto !== false ? ' checked' : '') + '> Passer seul à la question suivante après une bonne réponse</label></div>';
    groups.forEach(gname => {
      const G = GROUPS[gname] || { color: '#0b3f94', icon: '', blurb: '' }, ts = TYPES.filter(t => t.group === gname);
      html += '<section class="qz-group" style="--g:' + G.color + '"><header class="qz-ghead"><span class="qz-gicon" aria-hidden="true">' + G.icon + '</span><div><h3>' + esc(gname) + '</h3><small>' + esc(G.blurb) + '</small></div><span class="qz-gcount">' + ts.length + ' quiz</span></header><div class="qz-grid">';
      ts.forEach(t => {
        const m = masteryOf(t), off = !m.n, mode = modeFor(t);
        const tag = t.kind === 'click' || mode === 'map' ? '<em class="qz-tag map">Carte</em>' : (mode === 'type' ? '<em class="qz-tag">Saisie</em>' : '<em class="qz-tag">Choix</em>');
        html += '<button class="qz-card" data-type="' + t.id + '"' + (off ? ' disabled title="Nécessite les frontières de la carte"' : '') + '>' + tag + '<b>' + esc(t.title) + '</b><span>' + esc(t.desc) + '</span>' +
          '<span class="mastery"><i style="width:' + (m.n ? Math.round(100 * m.known / m.n) : 0) + '%"></i></span><small>' + (off ? 'Nécessite la carte' : m.known + ' sur ' + m.n + ' maîtrisés') + '</small></button>';
      });
      html += '</div></section>';
    });
    html += '<p class="qz-foot">Une question est « maîtrisée » après deux réponses avec au moins 70 % de réussite. Les points faibles reviennent plus souvent. <button class="link" id="qz-reset">Réinitialiser la progression</button></p>';
    $('qz-menu').innerHTML = html;
    showScreen('menu');
  }

  function showScreen(name) {
    ['menu', 'play', 'end'].forEach(n => { $('qz-' + n).hidden = n !== name; });
  }

  /* ------------------------------------------------------ initialisation */
  function init() {
    $('quiz').addEventListener('click', e => {
      const t = e.target.closest('button, label'); if (!t) return;
      if (t.dataset.type) { start(t.dataset.type); return; }
      if (t.dataset.opt) { store.opts[t.dataset.opt] = t.dataset.opt === 'count' ? +t.dataset.val : t.dataset.val; save(); renderMenu(); return; }
      if (t.classList.contains('qz-choice')) { submit(t.dataset.v, 'choice'); return; }
      if (t.id === 'qz-next') { goNext(); return; }
      if (t.id === 'qz-skip') { submit(null, 'skip'); return; }
      if (t.id === 'qz-quit') { finish(true); return; }
      if (t.id === 'qz-tomenu') { enter(); return; }
      if (t.id === 'qz-again') { start(session.t.id); return; }
      if (t.id === 'qz-again-missed') { start(session.t.id, session.missed.slice()); return; }
      if (t.id === 'qz-reset') {
        if (confirm('Effacer toute la progression des quiz sur cet ordinateur ?')) { store.stats = {}; save(); renderMenu(); }
      }
    });
    $('quiz').addEventListener('change', e => {
      if (e.target.id === 'opt-overseas') { store.opts.overseas = e.target.checked; save(); renderMenu(); }
      if (e.target.id === 'opt-auto') { store.opts.auto = e.target.checked; save(); }
    });
    $('quiz').addEventListener('submit', e => {
      e.preventDefault();
      const inp = $('qz-input'); if (inp && inp.value.trim()) submit(inp.value, 'type');
    });
    document.addEventListener('keydown', e => {
      if (session && !session.over && session.answered && (e.key === 'Enter' || e.key === ' ')) {
        if (document.activeElement && document.activeElement.id === 'qz-next') return;   /* le bouton s'en charge */
        e.preventDefault(); goNext(); return;
      }
      if (!session || session.over || !session.q || session.answered) return;
      if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= 4 && session.q.choices && session.input === 'choice') {
        const c = session.q.choices[n - 1]; if (c) submit(c.value, 'choice');
      }
    });
  }

  function enter() { if (session) clearTimeout(session.auto); banner(null); EXPLORE.clear(); MAP.clearHighlights(); MAP.setLayers(Object.assign({}, OFF, { fill: true, regionLines: true, deptLines: true, paris: true })); MAP.flyTo(null); renderMenu(); }
  function leave() { if (session) clearTimeout(session.auto); session = null; banner(null); MAP.clearHighlights(); EXPLORE.applyChips(); EXPLORE.show(); }
  function refresh() { if (!session && !$('qz-menu').hidden) renderMenu(); }

  return { init, enter, leave, onMapClick, onHover, refresh, TYPES,
           _state: () => ({ session, store }), _submit: submit, _start: start, _next: next };
})();

/* ===== main.js ===== */
/* main.js — start-up: load borders, wire the panels together. */
(function () {
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const D = {}; FR.DEPTS.forEach(d => { D[d.code] = d; });
  const nameToCode = {}; FR.DEPTS.forEach(d => { nameToCode[GEO.norm(d.name)] = d.code; });
  const OVERSEAS_REGIONS = ['01', '02', '03', '04', '06'];
  let mode = 'explore';
  const checks = { shapes: 0, missing: [], prefOutside: [], overseas: 0 };

  MAP.init($('mapwrap'));
  EXPLORE.init();
  QUIZ.init();
  LEARN.init({ toQuiz: () => setMode('quiz') });

  /* ----------------------------------------------------------- map events */
  MAP.on('click', (layer, id) => { if (mode === 'explore') EXPLORE.onMapClick(layer, id); else if (mode === 'learn') LEARN.onMapClick(layer, id); else QUIZ.onMapClick(layer, id); });
  const tip = $('tip');
  const moveTip = e => {
    const r = $('mapwrap').getBoundingClientRect();
    tip.style.left = Math.max(8, Math.min(e.clientX - r.left + 14, r.width - tip.offsetWidth - 8)) + 'px';
    tip.style.top = Math.max(8, e.clientY - r.top + 18) + 'px';
  };
  MAP.on('hover', (layer, id, e) => {
    EXPLORE.onHover(mode === 'explore' ? layer : null, id);
    if (mode === 'quiz') QUIZ.onHover(layer, id);
    const html = mode === 'explore' && layer ? EXPLORE.tooltipFor(layer, id) : '';
    if (!html) { tip.hidden = true; return; }
    tip.innerHTML = html; tip.hidden = false; moveTip(e);
  });
  MAP.on('move', e => { if (!tip.hidden) moveTip(e); });

  $('zin').addEventListener('click', () => MAP.zoomBy(1 / 1.6));
  $('zout').addEventListener('click', () => MAP.zoomBy(1.6));
  $('zhome').addEventListener('click', () => MAP.flyTo(null));
  $('reload').addEventListener('click', async () => { await LOADER.cacheClear(); location.reload(); });

  /* ---------------------------------------------------------- mode switch */
  function setMode(m) {
    if (m === mode) return;
    const prev = mode;
    mode = m; document.body.dataset.mode = m; tip.hidden = true;
    ['explore', 'learn', 'quiz'].forEach(k => { $('tab-' + k).setAttribute('aria-selected', String(m === k)); $(k).hidden = m !== k; });
    $('chips').hidden = m === 'quiz';
    if (prev === 'learn') LEARN.leave();
    if (prev === 'quiz') QUIZ.leave();
    if (m === 'quiz') QUIZ.enter();
    else if (m === 'learn') { EXPLORE.clear(); EXPLORE.applyChips(); LEARN.enter(); }
    else if (prev === 'learn') { EXPLORE.applyChips(); EXPLORE.show(); }
  }
  $('tab-explore').addEventListener('click', () => setMode('explore'));
  $('tab-learn').addEventListener('click', () => setMode('learn'));
  $('tab-quiz').addEventListener('click', () => setMode('quiz'));

  /* -------------------------------------------------------------- banners */
  function banner(html, cls) { const b = $('banner'); b.className = 'banner ' + (cls || ''); b.innerHTML = html; b.hidden = false; }
  function hideBanner() { $('banner').hidden = true; }

  function failureBanner(errors, problems) {
    banner(
      '<h3>Les frontières n\'ont pas été chargées</h3>' +
      '<p>France Explorer dessine les départements à partir d\'un fichier GeoJSON libre. Le téléchargement a échoué, ce qui signifie en général qu\'il n\'y a pas de connexion internet pour le moment.</p>' +
      '<p><b>À faire une seule fois :</b> connectez-vous à internet puis appuyez sur <b>Réessayer</b>. Les frontières sont ensuite enregistrées sur cet ordinateur et fonctionnent hors ligne.</p>' +
      '<p>Ou téléchargez <code>departements-version-simplifiee.geojson</code> et <code>regions-version-simplifiee.geojson</code> depuis ' +
      '<a href="https://github.com/gregoiredavid/france-geojson" target="_blank" rel="noopener">github.com/gregoiredavid/france-geojson</a>, puis glissez-les ici ou choisissez-les.</p>' +
      '<div class="banner-actions"><button class="btn primary" id="retry">Réessayer</button><button class="btn" id="pick">Choisir des fichiers…</button></div>' +
      (problems && problems.length ? '<p class="bad-note">' + problems.map(esc).join('<br>') + '</p>' : '') +
      (errors && errors.length ? '<details><summary>Ce qui a été essayé</summary><pre>' + errors.map(esc).join('\n') + '</pre></details>' : ''),
      'err');
    $('retry').addEventListener('click', loadMap);
    $('pick').addEventListener('click', () => $('filepick').click());
  }

  /* --------------------------------------------------------------- borders */
  function resolveCode(f) {
    if (D[f.code]) return f.code;
    const byName = nameToCode[GEO.norm(f.name)];
    return byName || null;
  }

  function applyGeo(res) {
    const shapes = [], seen = new Set(), droms = {};
    LOADER.features(res.depts).forEach(f => {
      const code = resolveCode(f); if (!code) return;
      if (D[code].overseas) { droms[code] = droms[code] || f; return; }
      if (seen.has(code)) return;
      const sh = GEO.shapeFromGeometry(f.geometry); if (!sh) return;
      seen.add(code); shapes.push({ code, d: sh.d, box: sh.box, cent: sh.cent, rings: sh.rings });
    });
    if (res.overseas) LOADER.features(res.overseas).forEach(f => { const c = resolveCode(f); if (c && D[c].overseas && !droms[c]) droms[c] = f; });

    const lines = [];
    if (res.regions) LOADER.features(res.regions).forEach(f => {
      if (OVERSEAS_REGIONS.includes(f.code)) return;
      const sh = GEO.shapeFromGeometry(f.geometry); if (sh) lines.push({ code: f.code, d: sh.d });
    });

    const insets = [];
    FR.DEPTS.filter(d => d.overseas).forEach(d => {
      const f = droms[d.code]; if (!f) return;
      try { insets.push({ code: d.code, d: GEO.fitGeometry(f.geometry, 80, 60, 5) }); } catch (e) { /* skip */ }
    });

    MAP.setDepts(shapes);
    MAP.setRegionLines(lines);
    MAP.setInsets($('insets'), insets);
    $('insets').hidden = !insets.length;

    /* consistency check: each préfecture should sit inside its own département */
    checks.shapes = shapes.length; checks.overseas = insets.length;
    checks.missing = FR.DEPTS.filter(d => !d.overseas && !seen.has(d.code)).map(d => d.code);
    checks.prefOutside = [];
    shapes.forEach(s => {
      const d = D[s.code], p = GEO.project(d.lat, d.lon);
      if (!GEO.pointInShape(p[0], p[1], s)) checks.prefOutside.push(s.code);
    });
    if (checks.missing.length || checks.prefOutside.length) console.warn('France Explorer border check', checks);

    QUIZ.refresh();
    EXPLORE.show();
    return checks;
  }

  async function loadMap() {
    banner('<p class="busy">Chargement des frontières…</p>', 'busy');
    let res;
    try { res = await LOADER.loadAll(msg => banner('<p class="busy">' + esc(msg) + '</p>', 'busy')); }
    catch (e) { res = { depts: null, errors: [String(e)] }; }
    if (!res.depts) { failureBanner(res.errors); return; }
    const c = applyGeo(res);
    if (c.shapes < 90) {
      banner('<h3>Seulement ' + c.shapes + ' départements sur 96 reconnus</h3><p>Le fichier utilise peut-être d\'autres codes. Vous pouvez glisser un autre fichier ici ou appuyer sur le bouton.</p>' +
        '<div class="banner-actions"><button class="btn" id="pick">Choisir des fichiers…</button><button class="btn ghost" id="dismiss">Continuer quand même</button></div>', 'err');
      $('pick').addEventListener('click', () => $('filepick').click());
      $('dismiss').addEventListener('click', hideBanner);
    } else hideBanner();
  }

  /* manual file loading: picker or drag-and-drop anywhere in the window */
  async function takeFiles(files) {
    if (!files || !files.length) return;
    banner('<p class="busy">Lecture des fichiers…</p>', 'busy');
    const { got, problems } = await LOADER.ingestFiles(files);
    if (!got.depts) { failureBanner([], problems.length ? problems : ['Aucun fichier de départements parmi les fichiers sélectionnés.']); return; }
    await loadMap();
  }
  $('filepick').addEventListener('change', e => takeFiles(e.target.files));
  window.addEventListener('dragover', e => { e.preventDefault(); });
  window.addEventListener('drop', e => { e.preventDefault(); takeFiles(e.dataTransfer && e.dataTransfer.files); });

  /* test hook */
  window.__fx = { applyGeo, checks, setMode, loadMap };
  loadMap();
})();
</script>

<script>(function(){
  var svg=document.querySelector('svg.map'), panel=document.getElementById('panel')||document.querySelector('aside.panel'), stage=document.querySelector('.stage');
  if(!svg||!panel||!stage) return;
  var mq=matchMedia('(max-width:700px)'), HEIGHTS={closed:'52px',half:'46%',full:'86%'}, state='closed', ready=false;
  var h=document.createElement('button'); h.type='button'; h.className='sheet-handle';
  h.innerHTML='<span><i></i></span>'; panel.insertBefore(h,panel.firstChild);
  function label(){ h.innerHTML='<i></i><span>'+(state==='closed'?'▲ Rechercher et détails':'▼ Replier')+'</span><i></i>'; }
  function set(s){ if(!mq.matches) return; state=s; stage.dataset.sheet=s; stage.style.setProperty('--sh',HEIGHTS[s]); label(); setTimeout(function(){window.dispatchEvent(new Event('resize'));},30); }
  mq.addEventListener&&mq.addEventListener('change',function(){ if(!mq.matches){stage.style.removeProperty('--sh');delete stage.dataset.sheet;} else set('closed'); });
  set('closed');
  var ty=null; h.addEventListener('touchstart',function(e){ty=e.touches[0].clientY;},{passive:true});
  h.addEventListener('touchend',function(e){ if(ty==null) return; var dy=e.changedTouches[0].clientY-ty; ty=null;
    if(Math.abs(dy)>40){ var o=['closed','half','full'],i=o.indexOf(state); set(o[Math.max(0,Math.min(2,i+(dy<0?1:-1)))]); e.preventDefault(); h.dataset.sw=1; setTimeout(function(){delete h.dataset.sw;},350); } },{passive:false});
  h.addEventListener('click',function(){ if(h.dataset.sw) return; set(state==='closed'?'half':'closed'); });
  /* la carte reprend la main : un doigt qui se pose sur la carte replie la fiche */
  svg.addEventListener('pointerdown',function(){ if(state!=='closed' && !document.body.dataset.playing) set('closed'); });
  /* ouverture automatique : fiche choisie, quiz, résultats */
  setTimeout(function(){ready=true;},1500);
  function watch(id,fn){ var el=document.getElementById(id); if(el) new MutationObserver(fn).observe(el,{childList:true,subtree:true,attributes:true,attributeFilter:['hidden']}); }
  watch('card',function(){ var c=document.getElementById('card'); if(ready && document.body.dataset.mode==='explore' && state==='closed' && c && !c.classList.contains('intro-card')) set('half'); });
  watch('qz-play',function(){ var p=document.getElementById('qz-play'); if(ready && p && !p.hidden && p.children.length) set('half'); });
  watch('qz-end',function(){ var p=document.getElementById('qz-end'); if(p && !p.hidden && p.children.length) set('half'); });
  new MutationObserver(function(){ if(document.body.dataset.mode==='quiz'||document.body.dataset.mode==='learn') set('half'); else if(ready) set('closed'); }).observe(document.body,{attributes:true,attributeFilter:['data-mode']});
  /* pincer pour zoomer, deux doigts pour déplacer, double tape pour zoomer */
  var t0=null, last=null;
  function inf(e){var a=e.touches[0],b=e.touches[1];return {d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)||1,x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2};}
  svg.addEventListener('touchstart',function(e){ if(e.touches.length===2){ window.dispatchEvent(new PointerEvent('pointerup',{bubbles:true})); t0=inf(e); if(window.__mapx) window.__mapx.cancel(); e.preventDefault(); } },{passive:false});
  svg.addEventListener('touchmove',function(e){ if(e.touches.length===2&&t0&&window.__mapx){ var t1=inf(e); window.__mapx.pan(t1.x-t0.x,t1.y-t0.y); window.__mapx.zoomAt(t1.x,t1.y,t0.d/t1.d); t0=t1; e.preventDefault(); } },{passive:false});
  svg.addEventListener('touchend',function(e){ if(e.touches.length<2) t0=null;
    if(e.touches.length===0&&e.changedTouches.length===1){ var c=e.changedTouches[0], now=Date.now();
      if(last&&now-last.t<320&&Math.hypot(c.clientX-last.x,c.clientY-last.y)<28&&window.__mapx){ window.__mapx.cancel(); window.__mapx.zoomAt(c.clientX,c.clientY,0.45); last=null; } else last={t:now,x:c.clientX,y:c.clientY}; } });
})();</script>
