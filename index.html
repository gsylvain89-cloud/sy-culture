<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SY Culture</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SY Culture">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<script src="audio/audio-list.js"></script>
<style>:root { --ink: #16222e; --muted: #5d6b78; --line: #dfe4ea; --bg: #f5f6f8; --card: #fff; --accent: #0b3f94; --ok: #1d7f4b; --bad: #b8352e;
  --font: "Segoe UI", system-ui, -apple-system, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); color: var(--ink); background: var(--bg); display: flex; flex-direction: column; font-size: 15px; }
button { font: inherit; color: inherit; cursor: pointer; }
kbd { font: 600 11px var(--font); border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; opacity: .55; margin-left: 4px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 24px; background: #fff; border-bottom: 1px solid var(--line); flex: none; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { margin: 0; font-size: 19px; }
.brand-mark { width: 28px; height: 28px; border-radius: 7px; background: #1f6f5b; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.nav { display: flex; gap: 4px; background: #eef1f4; border-radius: 10px; padding: 3px; }
.nav button { border: 0; background: none; padding: 6px 14px; border-radius: 8px; font-weight: 600; color: var(--muted); }
.nav button[aria-current="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(17,28,38,.1); }
main { flex: 1; overflow: auto; padding: 24px clamp(16px, 4vw, 48px) 48px; max-width: 1100px; width: 100%; margin: 0 auto; }
.muted { color: var(--muted); }
.eyebrow { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.btn { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 9px 16px; font-weight: 600; }
.btn:hover { border-color: #b9c3cc; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.big { padding: 13px 22px; font-size: 16px; }
.btn.good { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.bad { background: #fff; border-color: var(--bad); color: var(--bad); }
.link { border: 0; background: none; color: var(--muted); text-decoration: underline; padding: 0; }
.back { border: 0; background: none; color: var(--muted); padding: 0; margin-bottom: 10px; font-weight: 600; }
.bar { display: block; height: 7px; background: #e7ebef; border-radius: 99px; overflow: hidden; flex: 1; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
/* accueil */
.hero { display: grid; grid-template-columns: 1fr 260px; gap: 28px; background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 26px 28px; box-shadow: 0 6px 24px rgba(17,28,38,.05); }
.hero h1 { margin: 0 0 12px; font-size: 28px; }
.hero .lead { color: #3d4b58; font-size: 16px; line-height: 1.5; margin: 0 0 16px; }
.plan { list-style: none; padding: 0; margin: 0 0 20px; display: grid; gap: 10px; font-size: 16px; }
.plan li { display: flex; align-items: center; gap: 10px; }
.pi { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; font-size: 16px; }
.pi.rev { background: #e6eefb; color: var(--accent); font-weight: 700; }
.side { display: grid; gap: 12px; align-content: start; }
.stat { background: #f6f7f9; border-radius: 12px; padding: 12px 14px; }
.stat b { display: block; font-size: 26px; line-height: 1.1; }
.stat span { color: var(--muted); font-size: 13px; }
.week { display: flex; gap: 5px; }
.week span { flex: 1; text-align: center; font-size: 11px; font-weight: 600; color: var(--muted); background: #eef1f4; border-radius: 6px; padding: 6px 0; }
.week span.on { background: #1f6f5b; color: #fff; }
.week span.today { outline: 2px solid #b9c3cc; outline-offset: 1px; }
.sec { font-size: 15px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 30px 0 12px; }
.themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.theme { text-align: left; background: #fff; border: 1px solid var(--line); border-top: 5px solid var(--t); border-radius: 14px; padding: 14px 16px; display: grid; gap: 6px; }
.theme:hover { box-shadow: 0 4px 16px rgba(17,28,38,.08); }
.theme b { font-size: 16px; }
.theme small { color: var(--muted); font-size: 12.5px; }
.ti { font-size: 24px; }
.ti.sm { font-size: 18px; margin-right: 8px; }
.how { color: var(--muted); font-size: 13.5px; line-height: 1.55; margin-top: 26px; max-width: 760px; }
/* fiches */
.pt { font-size: 26px; margin: 0 0 16px; }
.lib { margin-bottom: 22px; }
.lib h2 { font-size: 17px; margin: 0 0 8px; display: flex; align-items: center; border-left: 4px solid var(--t); padding-left: 10px; }
.flist { display: grid; gap: 6px; }
.frow { display: flex; align-items: center; gap: 12px; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.frow:hover { border-color: #b9c3cc; }
.fnum { width: 26px; height: 26px; border-radius: 50%; background: #eef1f4; display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
.ft { flex: 1; display: grid; }
.ft small { color: var(--muted); }
.badge { font-size: 12px; font-weight: 600; border-radius: 99px; padding: 3px 10px; white-space: nowrap; }
.badge.new { background: #eef1f4; color: var(--muted); }
.badge.wip { background: #fff3c4; color: #7a5a00; }
.badge.done { background: #dff3e7; color: var(--ok); }
.lesson { background: #fff; border: 1px solid var(--line); border-top: 6px solid var(--t); border-radius: 16px; padding: 24px 30px; max-width: 760px; }
.lesson h1 { margin: 0 0 14px; font-size: 26px; }
.lesson p { font-size: 17px; line-height: 1.65; margin: 0 0 14px; color: #26333f; }
.lesson b { color: var(--ink); }
.keys { background: #f6f7f9; border-radius: 12px; padding: 12px 18px; margin: 18px 0; }
.keys h3 { margin: 4px 0 6px; font-size: 14px; text-transform: uppercase; letter-spacing: .05em; color: var(--t); }
.keys ul { margin: 0; padding-left: 20px; line-height: 1.7; font-size: 15.5px; }
.actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
/* séance */
.sess { max-width: 760px; margin: 0 auto; }
.sess-top { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.qcard { background: #fff; border: 1px solid var(--line); border-top: 6px solid var(--t); border-radius: 18px; padding: 26px 30px; box-shadow: 0 6px 24px rgba(17,28,38,.05); }
.q { font-size: 23px; line-height: 1.35; margin: 4px 0 20px; }
.newtag { color: var(--t); }
.choices { display: grid; gap: 8px; }
.choice { display: flex; align-items: center; gap: 12px; text-align: left; border: 1.5px solid var(--line); background: #fff; border-radius: 12px; padding: 12px 16px; font-size: 16.5px; }
.choice kbd { margin: 0; }
.choice:hover:not(:disabled) { border-color: var(--t); background: #fafbfc; }
.choice:disabled { cursor: default; }
.choice.ok { border-color: var(--ok); background: #e7f6ee; }
.choice.bad { border-color: var(--bad); background: #fbeceb; }
.recall { display: grid; gap: 12px; }
.answer { font-size: 22px; font-weight: 700; margin: 0; padding: 14px 16px; background: #f6f7f9; border-radius: 12px; }
.selfgrade { display: flex; gap: 10px; flex-wrap: wrap; }
.selfgrade .btn { flex: 1; padding: 12px; }
.fb .good { color: var(--ok); font-weight: 700; font-size: 17px; margin: 16px 0 4px; }
.fb .wrong { color: var(--bad); font-weight: 600; font-size: 16px; margin: 16px 0 4px; }
.expl { color: #3d4b58; margin: 6px 0 0; line-height: 1.5; }
.next { margin-top: 16px; }
.in-sess { margin: 0 auto; }
.end h3 { margin: 18px 0 6px; font-size: 15px; }
.weak { padding-left: 20px; line-height: 1.7; margin: 0 0 12px; }
.hero.end { grid-template-columns: 1fr; }
/* progrès */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.kpis .stat { background: #fff; border: 1px solid var(--line); }
.cal { display: grid; grid-template-columns: repeat(21, 18px); gap: 4px; }
.cal span { width: 18px; height: 18px; border-radius: 4px; background: #e7ebef; }
.cal .l1 { background: #a7d7bf; } .cal .l2 { background: #4fa47c; } .cal .l3 { background: #1f6f5b; }
.boxes { display: flex; gap: 10px; flex-wrap: wrap; }
.boxes div { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; min-width: 120px; }
.boxes b { display: block; font-size: 22px; }
.boxes span { color: var(--muted); font-size: 13px; }
.chk { display: flex; gap: 8px; align-items: center; }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; } .top { padding: 10px 14px; } }

/* photos (cinéma) */
.photo { margin: 0 0 18px; display: flex; justify-content: center; }
.photo img { height: 260px; max-width: 100%; object-fit: cover; border-radius: 14px; background: #eef1f4; box-shadow: 0 4px 16px rgba(17,28,38,.12); }
.photo img:not([src]) { width: 200px; }
.photo .nophoto { display: none; }
.photo.failed img { display: none; }
.photo.failed .nophoto { display: block; background: #f6f7f9; border-radius: 12px; padding: 18px; color: var(--muted); text-align: center; line-height: 1.6; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; margin: 18px 0; }
.gcard { display: grid; gap: 2px; text-align: center; }
.gcard .photo { margin: 0 0 6px; }
.gcard .photo img { height: 150px; width: 100%; border-radius: 10px; }
.gcard .photo.failed .nophoto { padding: 10px; font-size: 12px; }
.gcard small { color: var(--muted); font-size: 12px; line-height: 1.35; }

/* ---------------- accueil : jeux */
.games { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.game { display: flex; gap: 14px; align-items: center; text-align: left; background: #fff; border: 1px solid var(--line); border-left: 5px solid var(--t); border-radius: 14px; padding: 14px 18px; }
.game:hover { border-color: #b9c3cc; border-left-color: var(--t); box-shadow: 0 4px 14px rgba(17,28,38,.06); }
.game .gi { font-size: 30px; }
.game b { display: block; font-size: 16.5px; }
.game small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.game small.rec { color: var(--ink); font-weight: 600; }
@media (max-width: 760px) { .games { grid-template-columns: 1fr; } }
.btn.sm { padding: 6px 12px; font-size: 13.5px; border-radius: 8px; }
.btn:disabled { opacity: .45; cursor: default; }
.chk.sm { font-size: 13px; color: var(--muted); }

/* ---------------- séance : défi et ordre */
.score { font-weight: 700; color: #b07a00; white-space: nowrap; }
.pts { color: #b07a00; font-weight: 700; margin-left: 6px; }
.timer { height: 5px; background: #eef1f4; border-radius: 99px; overflow: hidden; margin: -8px 0 16px; }
.timer i { display: block; height: 100%; width: 100%; background: #e0a100; border-radius: 99px; }
.timer i.low { background: var(--bad); }
.hint { margin: -10px 0 14px; font-size: 13.5px; }
.order { display: grid; gap: 8px; }
.oitem { display: flex; align-items: center; gap: 12px; text-align: left; border: 1.5px solid var(--line); border-left: 5px solid var(--c); background: #fff; border-radius: 12px; padding: 11px 14px; font-size: 16px; }
.oitem:hover { background: #fafbfc; }
.oitem.on { background: #f3f1fb; border-color: #5a48b0; border-left-color: var(--c); }
.onum { width: 28px; height: 28px; flex: none; border-radius: 50%; border: 2px dashed #c9cfd6; display: grid; place-items: center; font-weight: 700; color: #fff; }
.oitem.on .onum { background: #5a48b0; border: 0; }
.ot { flex: 1; }
.ot small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.oresult { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; counter-reset: o; }
.oresult li { display: flex; gap: 14px; align-items: baseline; padding: 10px 14px; border-radius: 12px; border-left: 5px solid var(--c); background: #f6f7f9; font-size: 16px; }
.oresult li b { min-width: 104px; font-variant-numeric: tabular-nums; }
.oresult li.ok { background: #e7f6ee; }
.oresult li.bad { background: #fbeceb; }
.oresult small { color: var(--muted); }

/* ---------------- frise */
main.wide { max-width: none; padding: 0; overflow: hidden; display: flex; }
.fz-wrap { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
.fz-tools { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; justify-content: space-between; padding: 10px 18px; background: #fff; border-bottom: 1px solid var(--line); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1.5px solid var(--line); background: #fff; border-radius: 99px; padding: 4px 11px; font-size: 13px; font-weight: 600; color: var(--muted); }
.chip.on { border-color: var(--c, var(--ink)); color: var(--ink); background: color-mix(in srgb, var(--c, #16222e) 10%, #fff); }
.fz-act { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.zoom { display: inline-flex; gap: 4px; }
.fz { flex: 1; overflow: auto; position: relative; cursor: grab; background: #fbfbfc; user-select: none; }
.fz.drag { cursor: grabbing; }
.fz-c { position: relative; min-height: 100%; padding-bottom: 30px; }
.fz-grid { position: absolute; inset: 0; pointer-events: none; }
.fz-grid i { position: absolute; top: 0; bottom: 0; border-left: 1px dashed #e3e7ec; }
.fz-grid i.now { border-left: 2px solid #e0a100; }
.fz-head { position: sticky; top: 0; z-index: 3; height: 62px; background: rgba(251,251,252,.94); backdrop-filter: blur(3px); border-bottom: 1px solid var(--line); }
.fz-era { position: absolute; top: 6px; height: 30px; border: 0; border-right: 2px solid #fff; background: var(--c); color: #2b2420; font-weight: 700; font-size: 13.5px; text-align: left; padding: 0; overflow: clip; }
.fz-era span { position: sticky; left: 8px; padding: 0 10px; white-space: nowrap; display: inline-block; line-height: 30px; }
.fz-era small { font-weight: 600; opacity: .7; margin-left: 6px; }
.fz-era:hover { filter: brightness(1.05); }
.fz-tick { position: absolute; top: 40px; font-size: 11.5px; font-weight: 600; color: var(--muted); transform: translateX(-50%); white-space: nowrap; }
.fz-band { position: relative; margin-top: 8px; }
.fz-band h3 { margin: 0; height: 26px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.fz-band h3 span { position: sticky; left: 14px; display: inline-block; padding: 4px 8px; background: rgba(251,251,252,.9); border-radius: 6px; }
.fz-band h3 small { font-weight: 600; opacity: .7; }
.fz-rows { position: relative; }
.fz-rows > button { position: absolute; border: 0; background: none; padding: 0; text-align: left; white-space: nowrap; font: 600 12.5px var(--font); }
.fz-s { height: 24px; }
.fz-s i { position: absolute; left: 0; top: 0; height: 24px; border-radius: 6px; background: color-mix(in srgb, var(--c) 22%, #fff); border-left: 3px solid var(--c); }
.fz-s span { position: sticky; left: 4px; line-height: 24px; padding-left: 9px; color: color-mix(in srgb, var(--c) 70%, #16222e); }
.fz-e { height: 25px; display: flex; align-items: center; gap: 6px; padding: 0 10px 0 0 !important; background: #fff !important; border: 1px solid var(--line) !important; border-radius: 99px; box-shadow: 0 1px 2px rgba(17,28,38,.05); }
.fz-e i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); margin-left: -1px; flex: none; box-shadow: 0 0 0 3px #fff; }
.fz-e b { font-size: 11.5px; color: var(--c); font-variant-numeric: tabular-nums; }
.fz-p { height: 46px; }
.fz-p .av { position: absolute; left: 0; top: 0; margin: 0; }
.photo.av img, .photo.av .nophoto { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; object-position: 50% 20%; box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px var(--c); }
.photo.av .nophoto { display: none; background: color-mix(in srgb, var(--c) 25%, #fff); color: var(--ink); font-weight: 700; place-items: center; padding: 0; font-size: 15px; }
.photo.av.failed .nophoto { display: grid; }
.fz-p .nm { position: absolute; left: 44px; top: 6px; }
.fz-p .life { position: absolute; left: 18px; top: 40px; height: 4px; border-radius: 99px; background: color-mix(in srgb, var(--c) 55%, #fff); }
.fz-rows > button.dim { opacity: .42; }
.fz-rows > button:hover { opacity: 1; z-index: 2; }
.fz-e:hover, .fz-e.sel { border-color: var(--c) !important; }
.fz-rows > button.sel, .fz-rows > button.hl { opacity: 1; z-index: 2; }
.fz-e.sel, .fz-e.hl { box-shadow: 0 0 0 2px var(--c); }
.fz-s.sel i, .fz-s.hl i { box-shadow: 0 0 0 2px var(--c); }
.fz-p.sel .nm, .fz-p.hl .nm { background: var(--c); color: #fff; padding: 1px 6px; border-radius: 6px; margin-left: -6px; }
.fz-d { position: absolute; right: 18px; bottom: 44px; width: 320px; max-height: calc(100% - 140px); overflow: auto; background: #fff; border: 1px solid var(--line); border-top: 5px solid var(--c); border-radius: 14px; padding: 16px 18px; box-shadow: 0 10px 30px rgba(17,28,38,.18); z-index: 5; }
.fz-d h3 { margin: 0 0 2px; font-size: 19px; }
.fz-d .when { margin: 0 0 8px; font-weight: 700; color: var(--c); }
.fz-d p { margin: 0 0 10px; line-height: 1.5; }
.fz-d .near { font-size: 13.5px; color: var(--muted); }
.lnk { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; font-size: 13.5px; text-align: left; }
.fz-x { position: absolute; right: 8px; top: 6px; border: 0; background: none; color: var(--muted); font-size: 15px; }
.photo.big { margin: 0 0 10px; justify-content: flex-start; }
.photo.big img { height: 150px; width: auto; border-radius: 10px; }
.fz-help { margin: 0; padding: 6px 18px; font-size: 12px; color: var(--muted); background: #fff; border-top: 1px solid var(--line); }

.photo img:not(.ok) { visibility: hidden; }
.photo.av { position: absolute; }
.photo.av .nophoto { display: grid; position: absolute; inset: 0; }
.photo.av img { position: relative; z-index: 1; }
.photo.big:not(:has(img.ok)) { display: none; }

.bigsym { font-size: 84px; line-height: 1; text-align: center; margin: 4px 0 14px; font-family: 'Segoe UI Emoji', 'Noto Color Emoji', 'Apple Color Emoji', sans-serif; }

/* ---------------- lecture des fiches */
.lesson { max-width: 820px; }
.lesson b { background: linear-gradient(transparent 58%, color-mix(in srgb, var(--t) 20%, transparent) 58%); padding: 0 1px; }
.rd-meta { color: var(--muted) !important; font-size: 13.5px !important; margin: -6px 0 16px !important; }
.rd-sec { margin: 0 0 14px; padding: 14px 18px 6px; background: #fafbfc; border: 1px solid var(--line); border-left: 4px solid var(--t); border-radius: 12px; }
.rd-sec h3 { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; font-size: 17px; }
.rd-n { width: 26px; height: 26px; flex: none; border-radius: 50%; background: var(--t); color: #fff; display: grid; place-items: center; font-size: 13.5px; }
.rd-sec ul { margin: 0; padding: 0 0 4px; list-style: none; }
.rd-sec li { position: relative; padding: 0 0 9px 22px; font-size: 16.5px; line-height: 1.6; color: #26333f; }
.rd-sec li::before { content: ''; position: absolute; left: 6px; top: .68em; width: 7px; height: 7px; border-radius: 50%; background: color-mix(in srgb, var(--t) 55%, #fff); }
.rd-frise { margin: 18px 0; padding: 14px 18px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
.rd-frise h3 { margin: 0 0 10px; font-size: 15px; }
.rd-frise ol { list-style: none; margin: 0 0 10px; padding: 0 0 0 4px; position: relative; }
.rd-frise ol::before { content: ''; position: absolute; left: 21px; top: 10px; bottom: 10px; border-left: 2px solid color-mix(in srgb, var(--t) 35%, #fff); }
.rd-frise li { position: relative; display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 3px 0; --c: var(--t); }
.rd-frise .dot { width: 14px; height: 14px; margin: 0 12px 0 11px; border-radius: 50%; background: var(--t); box-shadow: 0 0 0 3px #fff; flex: none; position: relative; }
.rd-frise .photo.av { position: relative; flex: none; margin: 0 0 0 0; width: 36px; height: 36px; }
.rd-frise .d { min-width: 108px; font-weight: 700; color: var(--t); font-variant-numeric: tabular-nums; font-size: 14.5px; }
.rd-frise .t { font-size: 15px; }

/* Aides partagées par les fichiers de données. */
/* Cartes « Qui est-ce ? » à partir d'une liste [nom, article Wikipédia, genre m/f, « connu pour »] ;
   leurres : trois autres personnes du même genre, choisies de façon fixe (les cartes ne changent pas d'une version à l'autre). */
CG.faces = function (list) {
  return list.map((a, i) => {
    const same = list.filter((b, j) => j !== i && b[2] === a[2]);
    const d = [0, 1, 2].map(k => same[(i * 3 + k * 2) % same.length][0]);
    const uniq = Array.from(new Set(d)); let j = 0;
    while (uniq.length < 3) { const n = same[j++][0]; if (!uniq.includes(n)) uniq.push(n); }
    const k = 'Connu' + (a[2] === 'f' ? 'e' : '') + ' pour : ' + a[3];
    return { q: 'Qui est-ce ?', img: a[1], hint: k, a: a[0], d: uniq, x: k + '.' };
  });
};

    });
    mine.forEach((o, i) => {
      if (/^anonyme/.test(o[2])) return;
      const pool = artists.filter(a => a !== o[2]);
      const local = Array.from(new Set(mine.map(x => x[2]))).filter(a => a !== o[2] && !/^anonyme/.test(a));
      const src = local.length >= 3 ? local : pool;
      const d = []; for (let k = 0; d.length < 3; k++) { const a = src[(i + k * 2) % src.length]; if (!d.includes(a)) d.push(a); if (k > 40) break; }
      cards.push({ q: SCULPT(fid) ? 'Qui a sculpté cette œuvre ?' : 'Qui a peint ce tableau ?', img: o[1], art: true, hint: o[0] + ', ' + o[3], a: o[2], d: d, x: o[0] + ' — ' + o[2] + ', ' + o[3] + ' (' + o[4] + ').' });

/* Culture générale (SY Culture) : fiches courtes + cartes revues au bon moment (répétition espacée). */
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const plural = (n, s, p) => n + ' ' + (n > 1 ? (p || s + 's') : s);

/* ---------------------------------------------------------------- données */
const THEMES = CG.themes, FICHES = [], CARDS = {}, FBY = {}, TBY = {};
THEMES.forEach(t => {
  TBY[t.id] = t;
  t.fiches.forEach((f, i) => {
    f.theme = t; f.index = i; FBY[f.id] = f; FICHES.push(f);
    f.cards.forEach((c, j) => { c.id = f.id + '-' + j; c.fiche = f; CARDS[c.id] = c; });
  });
});
/* ordre d'apprentissage : 1re fiche de chaque thème, puis 2e de chaque thème, etc. */
const ORDER = []; for (let i = 0; i < 12; i++) THEMES.forEach(t => { if (t.fiches[i]) ORDER.push(t.fiches[i]); });

/* ---------------------------------------------------------------- répétition espacée */
const INTERVALS = [0, 1, 3, 7, 14, 30, 60, 120];   /* jours d'attente selon la boîte */
const MASTER = 4;                                  /* boîte à partir de laquelle une carte est « ancrée » */
const RECALL = 3;                                  /* à partir de la boîte 3 : rappel libre au lieu du QCM */
const KEY = 'sy-culture-gen.v1';
let S = (() => { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.cards) return s; } catch (e) { /* ignoré */ } return null; })()
  || { cards: {}, fiches: {}, days: {}, opts: {} };
S.opts = Object.assign({ newPerDay: 1, maxReviews: 30, alwaysChoice: false }, S.opts);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignoré */ } schedulePush(); };
const dayNum = (d) => { d = d || new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 864e5); };
const dayIso = n => new Date(n * 864e5).toISOString().slice(0, 10);
const today = () => dayNum();
const st = id => S.cards[id];
const isDue = id => { const s = st(id); return !!s && s.due <= today(); };
const ficheStarted = f => f.cards.some(c => st(c.id)) || !!S.fiches[f.id];
const ficheMastery = f => f.cards.filter(c => st(c.id) && st(c.id).b >= MASTER).length / f.cards.length;
const ficheSeen = f => f.cards.filter(c => st(c.id)).length;
function ficheStatus(f) {
  if (!ficheStarted(f)) return { cls: 'new', label: 'À découvrir' };
  const m = ficheMastery(f);
  if (m >= 1) return { cls: 'done', label: 'Acquise' };
  return { cls: 'wip', label: 'En cours · ' + Math.round(m * 100) + ' %' };
}
function dueCards() {
  const t = today();
  return Object.keys(S.cards).filter(id => CARDS[id] && S.cards[id].due <= t).sort((a, b) => S.cards[a].due - S.cards[b].due || S.cards[a].b - S.cards[b].b);
}
function nextNewFiche() { return ORDER.find(f => !ficheStarted(f)) || null; }
/* fiches nouvelles du jour : de quoi remplir une séance de 10-15 min (≈ 18 cartes), au plus 2 fiches */
function plannedLessons(nReviews, extra) {
  const out = [], todo = ORDER.filter(f => !ficheStarted(f));
  let cards = nReviews;
  for (const f of todo) {
    if (out.length >= 2) break;
    if (!extra && (cards >= 18 || nReviews >= 20)) break;
    out.push(f); cards += f.cards.length;
    if (extra) break;
  }
  return out;
}
function grade(id, ok, practice) {
  const t = today(), s = S.cards[id] || { b: 0, due: t, n: 0, ok: 0 };
  s.n++; if (ok) s.ok++;
  if (ok) { if (!practice || s.b === 0) { s.b = Math.min(s.b + 1, INTERVALS.length - 1); s.due = t + INTERVALS[s.b]; } }
  else { s.b = 1; s.due = t + 1; }
  s.last = t; S.cards[id] = s;
  const d = S.days[dayIso(t)] || { n: 0, ok: 0 }; d.n++; if (ok) d.ok++; S.days[dayIso(t)] = d;
  save();
}
function streak() {
  let n = 0, d = today();
  if (!S.days[dayIso(d)]) d--;          /* la série tient encore si on n'a pas encore travaillé aujourd'hui */
  while (S.days[dayIso(d)]) { n++; d--; }
  return n;
}
const mastered = () => Object.keys(S.cards).filter(id => CARDS[id] && S.cards[id].b >= MASTER).length;

/* ---------------------------------------------------------------- photos (enregistrées dans web/photos, sinon Wikipédia) */
const PKEY = 'sy-culture-gen.photos';
let PHOTOS = (() => { try { return JSON.parse(localStorage.getItem(PKEY)) || {}; } catch (e) { return {}; } })();
const pending = {}, QUEUE = []; let active = 0;
function pump() {
  while (active < 2 && QUEUE.length) {
    const job = QUEUE.shift(); active++;
    job().finally(() => setTimeout(() => { active--; pump(); }, 250));
  }
}
function loadPhoto(title) {
  if (PHOTOS[title]) return Promise.resolve(PHOTOS[title]);
  if (pending[title]) return pending[title];
  const slot = fn => new Promise((res, rej) => { QUEUE.push(() => fn().then(res, rej)); pump(); });   /* au plus 2 requêtes à la fois */
  /* la file ne tient que la requête elle-même : une nouvelle tentative (après un « trop de requêtes ») repasse par la file */
  const get = (lang, tries) => slot(() => fetch('https://' + lang + '.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title))
      .then(r => r.status === 429 ? { busy: true } : (r.ok ? r.json() : Promise.reject(new Error(r.status)))))
    .then(j => {
      if (j && j.busy) { if (tries > 0) return new Promise(res => setTimeout(res, 1500)).then(() => get(lang, tries - 1)); throw new Error('busy'); }
      if (j && j.thumbnail && j.thumbnail.source) return j.thumbnail.source.replace(/\/\d+px-/, '/400px-');
      if (j && j.originalimage) return j.originalimage.source;
      throw new Error('no image');
    });
  pending[title] = get('fr', 2).catch(() => get('en', 2)).then(url => {
    PHOTOS[title] = url; try { localStorage.setItem(PKEY, JSON.stringify(PHOTOS)); } catch (e) { /* ignoré */ }
    return url;
  }).finally(() => { delete pending[title]; });
  return pending[title];
}
/* remplit les <img data-wiki> présents dans la page ; si la photo ne vient pas, l'indice prend sa place */
/* nom de fichier sans accents ni signes (identique dans tools/fetch_photos.py) */
const photoSlug = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9_-]+/g, '_');
const localPhoto = t => 'photos/' + photoSlug(t) + '.jpg';
function fillPhotos() {
  document.querySelectorAll('img[data-wiki]:not([data-done])').forEach(img => {
    img.dataset.done = '1';
    img.onload = () => img.classList.add('ok');
    const fail = () => { const f = img.closest('.photo'); if (f) f.classList.add('failed'); };
    /* 1) photo enregistrée avec l'application (hors connexion)  2) sinon Wikipédia  3) sinon l'indice */
    img.onerror = () => {
      img.onerror = fail;
      loadPhoto(img.dataset.wiki).then(url => { img.src = url; }).catch(fail);
    };
    img.src = localPhoto(img.dataset.wiki);
  });
}
const photoHtml = (c, cls) => '<figure class="photo ' + (cls || '') + '"><img data-wiki="' + esc(c.img) + '" alt="Photo"><figcaption class="nophoto">Photo indisponible (pas de connexion ?)' + (c.hint ? '<br><b>Indice : ' + esc(c.hint.replace(/^Connue? pour : /, '')) + '</b>' : '') + '</figcaption></figure>';

function go(name, arg) { view = { name, arg }; render(); window.scrollTo(0, 0); const m = $('main'); if (m) m.scrollTop = 0; }

/* découpe un paragraphe en phrases (sans couper « av. J.-C. » ni un passage en gras) */
function sentences(p) {
  const parts = p.split(/(?<=[.!?…](?:\*\*)?)\s+(?=[A-ZÀ-ÖØ-Ý«*(0-9])/), out = [];
  parts.forEach(s => {
    const prev = out[out.length - 1];
    if (prev && (/\b(av|apr|env|cf|St|M|Mme)\.$/.test(prev) || (prev.split('**').length - 1) % 2)) out[out.length - 1] = prev + ' ' + s;
    else out.push(s);
  });
  return out;
}
/* coupe une chaîne sur un séparateur, hors parenthèses et hors passages en gras */
function splitOut(str, sep) {
  const out = []; let depth = 0, bold = false, cur = '';
  for (let i = 0; i < str.length; i++) {
    if (str.startsWith('**', i)) { bold = !bold; cur += '**'; i++; continue; }
    const ch = str[i];
    if (ch === '(') depth++; else if (ch === ')') depth = Math.max(0, depth - 1);
    if (!depth && !bold && str.startsWith(sep, i)) { out.push(cur); cur = ''; i += sep.length - 1; continue; }
    cur += ch;
  }
  out.push(cur);
  return out.map(x => x.trim()).filter(Boolean);
}
/* une longue énumération « intro : a, b, c et d » devient une petite liste */
function sentenceHtml(s) {
  if (s.length < 150) return md(s);
  const parts = splitOut(s, ' : ');
  if (parts.length < 2) return md(s);
  const head = parts.slice(0, -1).join(' : '), tail = parts[parts.length - 1].replace(/\.$/, '');
  let items = splitOut(tail, ' ; ');
  if (items.length < 3) {
    items = splitOut(tail, ', ');
    const m = []; items.forEach(x => { if (m.length && /^((le|la|les) plus\b|(le|la) «|qui\b|dont\b|née?\b|devenue?\b|même\b)/.test(x)) m[m.length - 1] += ', ' + x; else m.push(x); });
    items = m;
    if (items.length >= 3) { const last = splitOut(items[items.length - 1], ' et '); if (last.length === 2 && !/^(son|sa|ses|leur|leurs)\b/.test(last[1])) items.splice(-1, 1, last[0], last[1]); }
  }
  if (items.length < 3) return md(s);
  return md(head) + ' :<ul class="sub">' + items.map(x => '<li>' + md(x.replace(/^et\s+/, '')) + '</li>').join('') + '</ul>';
}
const readMins = f => Math.max(1, Math.round((f.text.join(' ').split(/\s+/).length + f.keys.join(' ').split(/\s+/).length) / 180));
/* corps d'une fiche : une section par paragraphe, une idée par ligne, la mini-frise, l'astuce et l'essentiel */

/* ---------------------------------------------------------------- séance */
function startSession(kind, ficheId) {
  const q = [], seen = new Set(), t = today();
  const add = (id, practice) => { if (!seen.has(id)) { seen.add(id); q.push({ id, practice: !!practice, tries: 0 }); } };
  let lessons = [];
  if (kind === 'daily' || kind === 'extra') {
    if (kind === 'daily') dueCards().slice(0, S.opts.maxReviews).forEach(id => add(id));
    lessons = plannedLessons(q.length, kind === 'extra');
  } else if (kind === 'fiche') {
    const f = FBY[ficheId];
    f.cards.forEach(c => { const s = st(c.id); add(c.id, !!s && s.due > t); });
    S.fiches[f.id] = S.fiches[f.id] || { read: t }; save();
  }
  sess = { kind, q, i: 0, lessons, li: 0, read: [], answered: false, results: [] };
  if (!q.length && !lessons.length) { go('home'); return; }
  go('session');
}
function current() { return sess.q[sess.i]; }
function session() {
  const s = sess;

    if (s.li < s.lessons.length) return lessonScreen();
    if (s.kind === 'daily' && !s.orderAdded) { s.orderAdded = true; const p = makeOrder(orderPool(true)); if (p) s.q.push({ order: p, tries: 0 }); }
    if (s.i >= s.q.length) return endNow();
  }
  const it = current();
  if (it.order) return orderScreen(it);
  const c = CARDS[it.id], stt = st(it.id), t = c.fiche.theme;
  const mode = (s.kind === 'defi' || S.opts.alwaysChoice || !stt || stt.b < RECALL || it.tries) ? 'choice' : 'recall';
  it.mode = mode;
  const done = s.results.length, total = done + (s.q.length - s.i) + s.lessons.slice(s.li).reduce((a, f) => a + f.cards.length, 0);
  let body;
  if (mode === 'choice') {
    it.choices = it.choices || shuffle([c.a].concat(c.d));
    body = '<div class="choices">' + it.choices.map((x, i) => '<button class="choice" data-v="' + esc(x) + '"><kbd>' + (i + 1) + '</kbd><span>' + esc(x) + '</span></button>').join('') + '</div>';
  } else body = '<div class="recall"><button class="btn big" data-act="reveal">Afficher la réponse <kbd>Espace</kbd></button></div>';
  return '<div class="sess" style="--t:' + t.color + '">' + sessTop(done, total, t.color) +
    '<div class="qcard"><p class="eyebrow">' + t.icon + ' ' + esc(t.name) + ' · ' + esc(c.fiche.title) + (stt || s.kind === 'defi' ? '' : ' · <span class="newtag">nouvelle</span>') + '</p>' + (c.big ? '<div class="bigsym" aria-hidden="true">' + c.big + '</div>' : '') + '<h2 class="q">' + esc(c.q) + '</h2>' + (c.img ? photoHtml(c, c.art ? 'art' : '') : '') + body +
    '<div class="fb" id="fb"></div><div class="next" id="nextwrap" hidden><button class="btn primary" data-act="next">Continuer <kbd>Entrée</kbd></button></div></div></div>';
}

function answer(ok, given) {
  const s = sess, it = current(); if (!it || s.answered) return;
  const c = CARDS[it.id];

  const pts = game && ok ? 100 + Math.round(50 * timeLeft()) : 0;
  clearTimer();
  if (!it.tries) { if (!game) grade(it.id, ok, it.practice); s.results.push({ id: it.id, ok, pts }); s.score = (s.score || 0) + pts; }
  it.tries++;
  if (!game && !ok && it.tries < 3) s.q.splice(Math.min(s.i + 4, s.q.length), 0, { id: it.id, practice: it.practice, tries: it.tries, again: true });

  $('fb').innerHTML = (ok ? '<p class="good">✓ Bonne réponse' + (pts ? ' <span class="pts">+' + pts + ' pts</span>' : '') + '</p>' : '<p class="wrong">' + (given === null ? '⏱ Temps écoulé. ' : '✗ ') + 'La réponse était : <b>' + esc(c.a) + '</b>' + (!game && it.tries < 3 ? ' <span class="muted">· elle reviendra dans quelques cartes</span>' : '') + '</p>') + (c.x ? '<p class="expl">' + esc(c.x) + '</p>' : '');

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.nav) { const to = b.dataset.nav; if (view.name === 'session' && sess && sess.results.length) { ask('Arrêter la séance ? Les réponses déjà données sont gardées.', 'Arrêter', () => go(to)); return; } go(to); return; }

  if (b.dataset.fiche) { go('fiche', b.dataset.fiche); return; }
  if (b.classList.contains('choice')) { const c = CARDS[current().id]; answer(b.dataset.v === c.a, b.dataset.v); return; }
  if (b.dataset.oi != null) { orderPick(+b.dataset.oi); return; }

  else if (a === 'learn') startSession('fiche', b.dataset.id);
  else if (a === 'lesson-ok') lessonOk();
  else if (a === 'reveal') reveal();
  else if (a === 'yes') answer(true);
  else if (a === 'no') answer(false);
  else if (a === 'next') nextCard();
  else if (a === 'stop') { if (sess.kind === 'defi' || sess.kind === 'ordre') { view = { name: 'game-end', arg: finishGame() }; } else view = { name: 'end', arg: sess.results }; render(); }

});

/* Culture générale : frise chronologique, « remettre dans l'ordre » et Défi du jour. Chargé après app.js. */

/* ---------------------------------------------------------------- données de la frise */

function pack(items, rowH) {

/* ---------------------------------------------------------------- écran frise */

function friseRefresh(keep) {

    const win = [40, 80, 150, 300, 800, 2500, 6000][Math.floor(Math.random() * 7)];
    const gap = Math.max(2, Math.round(win / 12));

  [3, 7].forEach(pos => { const p = makeOrder(op); if (p) q.splice(pos, 0, { order: p, tries: 0 }); });

/* Synchronisation de la progression entre appareils.
   Dans la version en ligne (page claude.ai), la progression est aussi gardée dans le stockage de la page (db, document
   progress/main, lisible et modifiable par le propriétaire seulement) ; chaque appareil garde sa copie locale et fusionne.
   Dans l'application du PC (fichier local), window.claude n'existe pas : rien ne change. */
var SYNC = { ref: null, ready: false, last: '', timer: null, busy: false, state: '' };
function setSync(state) {
  SYNC.state = state;

  const txt = { loading: '☁️ Synchronisation…', ok: '☁️ Synchronisé', offline: '⚠️ Hors ligne : enregistré sur cet appareil', error: '⚠️ Synchronisation impossible' }[state];

/* fusion : pour chaque carte, l'état le plus récent ; jours et records : le maximum ; options : celles de cet appareil */
function mergeS(a, b) {
  if ((b.resetAt || 0) > (a.resetAt || 0)) return JSON.parse(JSON.stringify(b));
  if ((a.resetAt || 0) > (b.resetAt || 0)) return JSON.parse(JSON.stringify(a));
  const m = JSON.parse(JSON.stringify(b));
  m.cards = m.cards || {}; m.fiches = m.fiches || {}; m.days = m.days || {};
  Object.entries(a.cards || {}).forEach(([id, c]) => { const r = m.cards[id]; if (!r || (c.last || 0) > (r.last || 0) || ((c.last || 0) === (r.last || 0) && (c.n || 0) > (r.n || 0))) m.cards[id] = c; });
  Object.entries(a.fiches || {}).forEach(([id, f]) => { if (!m.fiches[id]) m.fiches[id] = f; });
  Object.entries(a.days || {}).forEach(([d, v]) => { const r = m.days[d]; if (!r || v.n > r.n) m.days[d] = v; });
  m.opts = Object.assign({}, b.opts, a.opts);
  if (a.defi || b.defi) {
    const A = a.defi || {}, B = b.defi || {};
    m.defi = { best: Math.max(A.best || 0, B.best || 0), plays: Math.max(A.plays || 0, B.plays || 0), days: Object.assign({}, B.days) };
    Object.entries(A.days || {}).forEach(([k, v]) => { m.defi.days[k] = Math.max(v, m.defi.days[k] || 0); });
  }

}

  const s = JSON.stringify(S); if (s === SYNC.last) return;

  catch (e) { setSync(e && e.code === 'quota_exceeded' ? 'error' : 'offline'); }

}
function applyRemote(remote) {
  const merged = mergeS(S, remote);

  S = merged;

async function syncStart() {

  if (!window.claude || typeof window.claude.use !== 'function') return;   /* application locale du PC */

async function ghFindOrCreate() {

    const r = await ghApi('/gists/' + GH.gist);
    if (r.status === 404) { GH.gist = ''; ghSave(); throw { code: 'retry' }; }
    if (r.status === 401 || r.status === 403) throw { code: 'auth' };
    if (!r.ok) throw { code: 'http' };
    const g = await r.json(), f = g.files && g.files[GH_FILE];
    let remote = null, txt = '';
    if (f) { txt = f.truncated ? await (await fetch(f.raw_url, { cache: 'no-store' })).text() : f.content; try { remote = JSON.parse(txt); } catch (e) { remote = null; } }
    if (remote && remote.cards) {
      const merged = mergeS(S, remote);
      if (JSON.stringify(merged) !== JSON.stringify(S)) {
        S = merged; S.opts = Object.assign({ newPerDay: 1, maxReviews: 30, alwaysChoice: false }, S.opts);
        try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignoré */ }
        if (['home', 'library', 'theme', 'fiche', 'stats'].includes(view.name) && !(document.getElementById('ask') && !document.getElementById('ask').hidden)) render();
      }
    }
    const mine = JSON.stringify(S);
    if (mine !== txt) {
      const p = await ghApi('/gists/' + GH.gist, { method: 'PATCH', body: JSON.stringify({ files: { [GH_FILE]: { content: mine } } }) });
      if (p.status === 401 || p.status === 403) throw { code: 'auth' };
      if (!p.ok) throw { code: 'http' };
    }
    GH.lastOk = Date.now(); ghSave(); ghBadge('ok');
  } catch (e) {
    ghBadge(e && e.code === 'auth' ? 'auth' : (navigator.onLine === false || !e || !e.code) ? 'offline' : 'error');
    if (e && e.code === 'retry') setTimeout(ghSync, 2000);
  }
  GH.busy = false;
}
function ghSoon(ms) { if (!GH.token) return; clearTimeout(GH.timer); GH.timer = setTimeout(ghSync, ms == null ? 20000 : ms); }
/* à la fermeture : un dernier envoi rapide (sans relire ; la synchro suivante de l'autre appareil refusionne) */
function ghFlush() {
  if (!GH.token || !GH.gist || navigator.onLine === false) return;
  const mine = JSON.stringify(S); if (GH.flushed === mine) return; GH.flushed = mine;
  try { ghApi('/gists/' + GH.gist, { method: 'PATCH', keepalive: mine.length < 60000, body: JSON.stringify({ files: { [GH_FILE]: { content: mine } } }) }).catch(() => {}); } catch (e) { /* ignoré */ }
}
function ghStart() {
  if (!GH.token) return;
  ghBadge(GH.lastOk ? 'ok' : 'syncing');
  setTimeout(ghSync, 800);
  setInterval(ghSync, 5 * 60 * 1000);
  window.addEventListener('online', () => ghSoon(1000));
  window.addEventListener('offline', () => ghBadge('offline'));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') ghFlush(); else ghSoon(500); });
  window.addEventListener('pagehide', ghFlush);
}
/* réglage du jeton (dans la fenêtre 🔄 Synchro) */
function ghPanel() {
  if (GH.token) return '<div class="ghp"><p><b>Synchro automatique GitHub : activée</b> <span class="muted" id="gh-status"></span></p>' +
    '<p class="muted">À l\'ouverture, toutes les 5 minutes, après tes réponses et à la fermeture.</p>' +
    '<div class="actions"><button class="btn primary" id="gh-now">Synchroniser maintenant</button><button class="btn" id="gh-off">Retirer le jeton de cet appareil</button></div></div>';
  return '<div class="ghp"><p><b>Synchro automatique GitHub</b> : colle ici ton jeton GitHub (il commence par <code>ghp_</code>). Il reste sur cet appareil.</p>' +
    '<div class="ghrow"><input id="gh-token" type="password" autocomplete="off" spellcheck="false" placeholder="ghp_…"><button class="btn primary" id="gh-save">Activer</button></div></div>';
}
function ghWire(d) {
  const sv = d.querySelector('#gh-save');
  if (sv) sv.onclick = async () => {
    const v = d.querySelector('#gh-token').value.trim();
    if (!/^(ghp_|github_pat_)[A-Za-z0-9_]{20,}$/.test(v)) { toast('Ce n\'est pas un jeton GitHub (il commence par ghp_).'); return; }
    GH.token = v; GH.gist = ''; GH.lastOk = 0; ghSave();
    sv.disabled = true; sv.textContent = 'Vérification…';
    await ghSync();
    if (GH.state === 'auth') { GH.token = ''; ghSave(); toast('GitHub refuse ce jeton : vérifie qu\'il a bien la case « gist ».'); syncBox(); return; }
    if (GH.state !== 'ok') { toast('Jeton enregistré. Pas de réseau pour l\'instant : la synchro se fera dès que possible.'); }
    else toast('✓ Synchro automatique activée.');
    ghStart(); syncBox();
  };
  const now = d.querySelector('#gh-now'); if (now) now.onclick = async () => { now.disabled = true; await ghSync(); now.disabled = false; toast(GH.state === 'ok' ? '✓ Synchronisé.' : 'Synchro impossible pour l\'instant (réseau ?).'); };
  const off = d.querySelector('#gh-off'); if (off) off.onclick = () => ask('Retirer le jeton GitHub de cet appareil ? Ta progression reste ici et sur GitHub, mais cet appareil ne se synchronisera plus.', 'Retirer', () => { GH.token = ''; GH.gist = ''; ghSave(); const e = document.getElementById('sync'); if (e) e.hidden = true; });
  ghBadge(GH.state || (GH.token ? 'ok' : ''));
}
ghStart();

/* Écoute des fiches : épisodes lus par ElevenLabs (audio/<fiche>.mp3), liste dans audio/audio-list.js (window.SY_AUDIO).
   Un seul lecteur pour toute l'app, en bas de l'écran ; commandes aussi sur l'écran verrouillé (Media Session). */
var AUD = { el: null, q: [], i: 0 };
const audioOf = f => (window.SY_AUDIO || {})[f && f.id];
const fmtDur = s => Math.floor(s / 60) + ' min' + (s % 60 ? ' ' + String(s % 60).padStart(2, '0') : '');
const hasAudio = () => Object.keys(window.SY_AUDIO || {}).some(id => FBY[id]);
function audioBtn(f) {
  const a = audioOf(f); if (!a) return '';
  return '<button class="btn listen" data-act="listen" data-id="' + f.id + '">🎧 Écouter la fiche <small>' + fmtDur(a.d) + '</small></button>';
}
/* l'écoute du jour : fiches de la séance, puis fiches à réviser, puis fiches commencées, puis toutes */
function dailyAudio() {
  const withA = FICHES.filter(f => audioOf(f));
  const planned = plannedLessons(dueCards().length, 0).filter(f => audioOf(f));
  const dueF = new Set(dueCards().map(id => CARDS[id].fiche));
  const due = withA.filter(f => dueF.has(f));
  let q = Array.from(new Set(planned.concat(due)));
  if (!q.length) q = withA.filter(f => ficheStarted(f));
  if (!q.length) q = withA;
  return q;
}
function audioTile() {
  if (!hasAudio()) return '';
  const q = dailyAudio(), tot = q.reduce((s, f) => s + audioOf(f).d, 0);
  return '<button class="game" data-act="listen-day" style="--t:#1f6f5b"><span class="gi">🎧</span><span><b>Écoute du jour</b><small>' + plural(q.length, 'épisode') + ' · ' + fmtDur(tot) + '</small><small class="rec">Comme un podcast : en marchant, dans les transports…</small></span></button>';
}
function playQueue(fiches, start) {
  AUD.q = fiches.filter(f => audioOf(f)); AUD.i = start || 0;
  if (!AUD.q.length) return;
  if (!AUD.el) {
    AUD.el = new Audio(); AUD.el.preload = 'auto';
    AUD.el.addEventListener('ended', () => { if (AUD.i < AUD.q.length - 1) { AUD.i++; loadCur(true); } else { barRender(); } });
    ['play', 'pause', 'timeupdate', 'loadedmetadata'].forEach(ev => AUD.el.addEventListener(ev, barTick));
    AUD.el.addEventListener('error', () => { const b = document.getElementById('pbar'); if (b) b.querySelector('.pt-sub').textContent = 'Épisode indisponible (pas de connexion ?)'; });
    if ('mediaSession' in navigator) {
      const ms = navigator.mediaSession;
      ms.setActionHandler('play', () => AUD.el.play());
      ms.setActionHandler('pause', () => AUD.el.pause());
      ms.setActionHandler('previoustrack', () => audStep(-1));
      ms.setActionHandler('nexttrack', () => audStep(1));
      try { ms.setActionHandler('seekbackward', d => { AUD.el.currentTime = Math.max(0, AUD.el.currentTime - (d.seekOffset || 15)); }); ms.setActionHandler('seekforward', d => { AUD.el.currentTime += (d.seekOffset || 15); }); } catch (e) { /* ignoré */ }
    }
  }
  loadCur(true);
}
function loadCur(play) {
  const f = AUD.q[AUD.i]; if (!f) return;
  AUD.el.src = 'audio/' + f.id + '.mp3';
  if (play) AUD.el.play().catch(() => {});
  if ('mediaSession' in navigator && window.MediaMetadata) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: f.title, artist: 'SY Culture', album: f.theme.name,
      artwork: [{ src: location.protocol === 'file:' ? 'icon.png' : 'icon-512.png', sizes: '512x512', type: 'image/png' }] });
  }
  barRender();
}
function audStep(d) { const n = AUD.i + d; if (n < 0 || n >= AUD.q.length) return; AUD.i = n; loadCur(true); }
function barRender() {
  let b = document.getElementById('pbar');
  if (!AUD.q.length) { if (b) b.hidden = true; document.body.classList.remove('playing'); return; }
  if (!b) { b = document.createElement('div'); b.id = 'pbar'; b.className = 'pbar'; document.body.appendChild(b); }
  const f = AUD.q[AUD.i];
  b.style.setProperty('--t', f.theme.color);
  b.innerHTML = '<button class="pb-btn" data-pb="prev" aria-label="Épisode précédent"' + (AUD.i ? '' : ' disabled') + '>⏮</button>' +
    '<button class="pb-btn big" data-pb="play" aria-label="Lecture / pause">▶</button>' +
    '<button class="pb-btn" data-pb="next" aria-label="Épisode suivant"' + (AUD.i < AUD.q.length - 1 ? '' : ' disabled') + '>⏭</button>' +
    '<div class="pt"><b>' + f.theme.icon + ' ' + esc(f.title) + '</b><span class="pt-sub">' + (AUD.q.length > 1 ? (AUD.i + 1) + ' / ' + AUD.q.length + ' · ' : '') + esc(f.theme.name) + '</span>' +
    '<input type="range" id="pb-seek" min="0" max="1000" value="0" aria-label="Position"></div>' +
    '<span class="pb-time" id="pb-time"></span><button class="pb-btn" data-pb="fiche" aria-label="Ouvrir la fiche" title="Ouvrir la fiche">📄</button><button class="pb-btn" data-pb="close" aria-label="Fermer le lecteur">✕</button>';
  b.hidden = false; document.body.classList.add('playing');
  b.querySelector('#pb-seek').addEventListener('input', e => { if (AUD.el.duration) AUD.el.currentTime = AUD.el.duration * e.target.value / 1000; });
  barTick();
}
function barTick() {
  const b = document.getElementById('pbar'); if (!b || !AUD.el) return;
  const p = b.querySelector('[data-pb="play"]'); if (p) p.textContent = AUD.el.paused ? '▶' : '⏸';
  const d = AUD.el.duration || 0, t = AUD.el.currentTime || 0;
  const s = b.querySelector('#pb-seek'); if (s && d && document.activeElement !== s) s.value = Math.round(t / d * 1000);
  const tm = b.querySelector('#pb-time'); if (tm) tm.textContent = d ? Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0') + ' / ' + Math.floor(d / 60) + ':' + String(Math.floor(d % 60)).padStart(2, '0') : '';
}
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-pb], [data-act="listen"], [data-act="listen-day"]'); if (!b) return;
  e.stopPropagation();
  if (b.dataset.act === 'listen') { const f = FBY[b.dataset.id]; if (AUD.q[AUD.i] === f && AUD.el && !AUD.el.ended) { AUD.el.paused ? AUD.el.play() : AUD.el.pause(); } else playQueue([f]); return; }
  if (b.dataset.act === 'listen-day') { playQueue(dailyAudio()); return; }
  const a = b.dataset.pb;
  if (a === 'play') AUD.el.paused ? AUD.el.play() : AUD.el.pause();
  else if (a === 'prev') audStep(-1);
  else if (a === 'next') audStep(1);
  else if (a === 'fiche') { if (!(view.name === 'session' && sess && sess.results.length)) go('fiche', AUD.q[AUD.i].id); }
  else if (a === 'close') { AUD.el.pause(); AUD.q = []; barRender(); }
}, true);

/* Démarrage : après tous les modules (leurs constantes doivent exister avant le premier affichage). */
render();
window.__cg = { S: () => S, go, startSession, CARDS, FICHES, today, grade, dueCards, FRISE, makeOrder, orderPool, startDefi, sess: () => sess, FZ };
</script>
<script>if ('serviceWorker' in navigator && location.protocol.startsWith('http')) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
