<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SY Svenska</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F5F99">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Svenska">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<style>:root{--bg:#F5F3EC;--card:#fff;--ink:#1d2733;--muted:#6a7482;--line:#e1ddd0;--blue:#1F5F99;--yellow:#F2C230;--good:#2f8f5b;--bad:#c4473a;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
kbd{font:600 11px/1 inherit;background:rgba(0,0,0,.08);border-radius:4px;padding:2px 5px;margin-left:6px}
.top{display:flex;align-items:center;gap:24px;padding:12px 28px;background:var(--blue);color:#fff;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px}.brand h1{font-size:19px;margin:0}
.brand-mark{width:32px;height:32px;border-radius:8px;background:var(--yellow);color:var(--blue);display:grid;place-items:center;font-weight:800}
.nav{display:flex;gap:4px}.nav button{background:none;border:0;color:#dbe7f3;padding:8px 14px;border-radius:8px}
.nav button:hover{background:rgba(255,255,255,.12)}.nav button[aria-current=true]{background:#fff;color:var(--blue);font-weight:600}
main{max-width:980px;margin:0 auto;padding:26px 24px 70px}
h1.pt{margin:6px 0 16px}.sec{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:30px 0 12px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
.muted{color:var(--muted)}.small{font-size:13px}
.btn{border:1px solid var(--line);background:#fff;padding:10px 18px;border-radius:10px;font-weight:600}
.btn:hover{border-color:var(--blue)}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.big{padding:14px 26px;font-size:17px}.btn.sm{padding:6px 12px}.btn.good{border-color:var(--good);color:var(--good)}.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px}
.back{background:none;border:0;color:var(--blue);padding:4px 0;margin-bottom:8px}
.hero{display:flex;gap:28px;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px 28px;border-top:5px solid var(--yellow)}
.hero h1{margin:0 0 12px;font-size:28px}.lead{font-size:17px}
.plan{list-style:none;padding:0;margin:0 0 18px}.plan li{display:flex;gap:12px;align-items:center;padding:6px 0}
.pi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--blue);color:#fff;flex:none}.pi.rev{background:#8a94a3}
.side{min-width:190px;display:flex;flex-direction:column;gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:10px 14px}.stat b{font-size:24px;display:block;line-height:1.1}.stat span{font-size:12px;color:var(--muted)}
.week{display:flex;gap:5px}.week span{flex:1;text-align:center;font-size:11px;padding:6px 0;border-radius:7px;background:var(--bg);color:var(--muted)}
.week span.on{background:var(--blue);color:#fff}.week span.today{outline:2px solid var(--yellow)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.theme{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;border-top:4px solid var(--t)}
.theme:hover{box-shadow:0 3px 12px rgba(0,0,0,.08)}.theme small{color:var(--muted)}
.ti{font-size:26px}.ti.sm{font-size:20px;margin-right:8px}
.bar{display:block;height:7px;background:var(--line);border-radius:5px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--blue)}
.how{color:var(--muted);font-size:14px;margin-top:28px}
.lib h2{margin:24px 0 10px;font-size:18px}.flist{display:flex;flex-direction:column;gap:8px}
.frow{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.frow:hover{border-color:var(--blue)}.fnum{width:28px;height:28px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px}
.ft{flex:1;display:flex;flex-direction:column}.ft small{color:var(--muted)}
.badge{font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;background:var(--bg);color:var(--muted);white-space:nowrap}
.badge.new{background:#e8f0f8;color:var(--blue)}.badge.wip{background:#fcf1cf;color:#8a6a00}.badge.done{background:#dcf0e5;color:var(--good)}
.lesson{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px 30px;border-top:5px solid var(--t,var(--blue))}
.lesson h1{margin:0 0 6px}.lesson p{font-size:17px;max-width:70ch}.rd-meta{color:var(--muted);font-size:13px!important}
.vh{margin:22px 0 8px}.vh small{font-weight:400;color:var(--muted)}
.vocab{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.vrow{display:grid;grid-template-columns:40px minmax(150px,1fr) minmax(150px,1fr);gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.vrow:last-child{border:0}.vsv{font-weight:700;font-size:17px;color:var(--blue)}.vnote{grid-column:2/4;font-size:13px;color:var(--muted)}
.play{width:32px;height:32px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:12px;flex:none}.play:hover{background:#174a79}
.keys{background:#fbf6e2;border-left:4px solid var(--yellow);border-radius:10px;padding:6px 18px;margin:20px 0}.keys h3{margin:10px 0 4px}.ess{margin:0 0 10px;padding-left:20px}
.actions{display:flex;align-items:center;gap:14px;margin-top:20px;flex-wrap:wrap}
.sess{max-width:720px;margin:0 auto}.sess-top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px 28px;border-top:5px solid var(--t)}
.q{font-size:24px;margin:6px 0 14px}.newtag{color:var(--blue);font-weight:700}.sayline{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 16px;font-size:17px}
.choice:hover:not(:disabled){border-color:var(--blue)}.choice kbd{margin:0}
.choice.ok{border-color:var(--good);background:#e6f5ec}.choice.bad{border-color:var(--bad);background:#fbeae7}
.typein{display:flex;gap:10px}.typein input,.search{flex:1;font:inherit;font-size:18px;padding:11px 14px;border:2px solid var(--line);border-radius:12px;width:100%}
.typein input:focus,.search:focus{outline:0;border-color:var(--blue)}.typein input.ok{border-color:var(--good)}.typein input.bad{border-color:var(--bad)}
.recall{text-align:center;padding:10px 0}.answer{font-size:26px;font-weight:700;color:var(--blue)}.selfgrade{display:flex;gap:12px;justify-content:center;margin-top:14px}
.fb{margin-top:16px}.good{color:var(--good);font-weight:600}.wrong{color:var(--bad);font-weight:600}.expl{background:var(--bg);border-radius:10px;padding:10px 14px;margin:10px 0}
.next{margin-top:16px;text-align:right}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.kpis .stat{background:var(--card);border:1px solid var(--line)}
.cal{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;max-width:520px}.cal span{aspect-ratio:1;border-radius:4px;background:var(--line)}
.cal .l1{background:#9bc1e3}.cal .l2{background:#4f8cc6}.cal .l3{background:var(--blue)}
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.boxes div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.boxes b{display:block;font-size:22px}.boxes span{font-size:12px;color:var(--muted)}
.weak{padding-left:18px}.opts{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.row select{font:inherit;padding:6px;max-width:60%}.chk{display:block;margin:8px 0}
.hero.end{display:block}
@media(max-width:700px){.hero{flex-direction:column}.vrow{grid-template-columns:36px 1fr}.vfr,.vnote{grid-column:2}.top{flex-wrap:wrap}.boxes{grid-template-columns:repeat(2,1fr)}}
.lvl{font-size:11px;font-weight:700;background:var(--yellow);color:#4a3a00;border-radius:6px;padding:1px 6px;vertical-align:middle;margin-left:4px}
.qfr{color:var(--muted);font-size:17px;margin:-6px 0 12px}.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--blue);color:transparent}
.order{margin:8px 0}.ordans{min-height:56px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-size:18px;font-weight:600}
.chip:hover:not(:disabled){border-color:var(--blue)}.chip.on{background:#e8f0f8;border-color:var(--blue)}.chip.used{opacity:.25}
.dw{color:var(--bad);font-weight:700;text-decoration:underline}.play.slow{background:#8a94a3;font-size:14px}

.tilehead{margin:-8px -8px 18px;padding:14px 18px 18px;border-radius:14px;color:#fff;text-align:center}.tilehead h1{margin:6px 0 0;font-size:1.5rem;color:#fff}.tilehead .tbig{font-size:2.6rem}.tilehead .link{float:left}
.tilegrid{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 10px;margin:8px 0 18px}
.tile{font:inherit;font-size:1.25rem;padding:12px 20px;border-radius:16px;border:1px solid #d9d6c8;background:linear-gradient(#fff,#e7e5d8);box-shadow:0 3px 6px rgba(0,0,0,.12);cursor:pointer;color:#222;min-width:64px}
.tile.flip{background:#fff7e0;color:#6b4e12;font-size:1.05rem}.tile.sel{outline:3px solid #1F5F99}.tile.s-learn{box-shadow:inset 6px 0 0 #F5B800,0 3px 6px rgba(0,0,0,.12)}.tile.s-known{box-shadow:inset 6px 0 0 #46A758,0 3px 6px rgba(0,0,0,.12)}.tile.s-done{box-shadow:inset 6px 0 0 #46A758,0 3px 6px rgba(0,0,0,.12)}
.tilebar{position:sticky;bottom:0;background:#fff;border:1px solid #d9d6c8;border-radius:14px;padding:12px 14px;margin:10px 0;box-shadow:0 -2px 10px rgba(0,0,0,.08)}
.ghp{background:#fff;border:1px solid #d9d6c8;border-radius:12px;padding:6px 14px;margin:6px 0}.ghrow input{padding:8px;border:1px solid #bbb;border-radius:8px;width:60%}
html{overflow-x:hidden}body{overflow-x:clip}
@media(max-width:700px){
  .top{gap:6px 10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;flex-wrap:wrap}
  .brand h1{font-size:17px}.brand-mark{width:28px;height:28px}
  .nav{width:100%;overflow-x:auto;gap:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}
  .nav button{padding:7px 11px;font-size:14px;white-space:nowrap;flex:none}
  main{padding:14px 12px 24px}
  .hero{padding:18px 16px;gap:16px}.hero h1{font-size:22px;line-height:1.25}.lead{font-size:15.5px}
  .btn.big{padding:12px 18px;font-size:16px;width:100%;margin-bottom:8px}
  .actions{display:flex;flex-direction:column;gap:8px}.actions .btn{width:100%}
  .themes{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.theme b{font-size:14.5px;overflow-wrap:anywhere}
  h1.pt{font-size:24px}
  .tile{font-size:1.1rem;padding:10px 14px}.tilehead{margin:0 0 14px}.tilebar{bottom:var(--tabs-h,0)}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .vrow{padding:8px 4px}
  input[type=text],input[type=search],.search{font-size:16px}
}

/* ---- 0.5 : genre en / ett, tableaux, pièges, introduction d'un mot ---- */
:root { --en: #1f6fb8; --en-bg: #e3f0fb; --ett: #d9731a; --ett-bg: #fdeedd; }
.gb { display: inline-block; font-size: .72em; font-weight: 700; letter-spacing: .02em; border-radius: 6px; padding: 1px 7px; margin-right: 7px; vertical-align: .08em; line-height: 1.5; }
.gb.g-en { background: var(--en-bg); color: var(--en); border: 1px solid var(--en); }
.gb.g-ett { background: var(--ett-bg); color: var(--ett); border: 1px solid var(--ett); }
.vrow.g-en { border-left: 4px solid var(--en); } .vrow.g-ett { border-left: 4px solid var(--ett); }
.tile.g-en { box-shadow: inset 0 -5px 0 var(--en); } .tile.g-ett { box-shadow: inset 0 -5px 0 var(--ett); }
.tile.g-en.flip, .tile.g-ett.flip { box-shadow: none; }
.choice.g-en { border-color: var(--en); } .choice.g-ett { border-color: var(--ett); }
.choices.two { grid-template-columns: 1fr 1fr; } .choices.two .choice { justify-content: center; font-size: 1.4rem; font-weight: 700; padding: 22px 12px; }
.tbl { margin: 18px 0; } .tbl h4 { margin: 0 0 8px; font-size: 1rem; }
.tscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid #dfe5ec; border-radius: 12px; background: #fff; }
.tbl table { border-collapse: collapse; width: 100%; font-size: .95rem; min-width: 320px; }
.tbl th { background: #eef3f8; text-align: left; padding: 9px 12px; font-weight: 700; white-space: nowrap; }
.tbl td { padding: 8px 12px; border-top: 1px solid #e8edf2; vertical-align: top; }
.tbl td.t0 { font-weight: 700; white-space: nowrap; }
.tbl .tn { margin: 6px 2px 0; color: #5b6b7a; font-size: .88rem; }
.pits { margin: 20px 0; padding: 14px 18px; background: #fff6e5; border: 1px solid #f0d9a8; border-radius: 14px; }
.pits h3 { margin: 0 0 6px; font-size: 1rem; }
.expl.warn { color: #9a4a00; font-weight: 600; }
.intro { text-align: center; padding: 8px 4px 4px; }
.intro .iw { font-size: 2.6rem; font-weight: 800; margin: 10px 0 4px; line-height: 1.2; }
.intro .iw .gb { font-size: .42em; vertical-align: .55em; }
.intro .ifr { font-size: 1.5rem; margin: 6px 0 14px; color: #33475b; }
.intro .imeta { margin: 4px 0; color: #4b5d6e; } .intro .imeta.hint { margin-top: 12px; font-size: .95rem; }
.intro .actions { justify-content: center; margin-top: 18px; }
@media (max-width: 700px) { .intro .iw { font-size: 2.1rem; } }

/* compact (0.5.1) */
.qcard.done .selfgrade{display:none}
.qcard.done .recall{padding:0}
.qcard.done .typein,.qcard.done .typein+p{display:none}
.fb p{margin:6px 0}.fb .expl{margin:6px 0;padding:8px 12px}
.sayline .muted{display:none}.sayline{margin-bottom:8px}
.next{position:sticky;bottom:calc(var(--tabs-h,0px) + 6px);background:linear-gradient(transparent,var(--card) 35%);padding-top:10px}
@media(max-width:700px){
  .qcard{padding:14px 14px 12px}
  .eyebrow{font-size:11px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .q{font-size:19px;line-height:1.3;margin:2px 0 8px}
  .qfr{font-size:15px;margin:-2px 0 8px}
  .choices{gap:7px}.choice{padding:9px 12px;font-size:16px}.choices.two .choice{padding:14px 8px;font-size:1.25rem}
  .recall{padding:4px 0}.answer{font-size:22px;margin:4px 0}
  .selfgrade{gap:8px;margin-top:8px}.selfgrade .btn{flex:1;padding:10px 8px;font-size:15px}
  .selfgrade kbd,.next kbd,.typein kbd{display:none}
  .btn.big{margin-bottom:0}
  .sess-top{margin-bottom:8px}
  .fb{margin-top:8px}.next{margin-top:8px}.next .btn{width:100%}
  .typein{gap:8px}
}

/* ---------------------------------------------------------------- lecture libre */
.hero-btns { display: flex; gap: 10px; flex-wrap: wrap; align-items: stretch; }
.btn.read { display: inline-flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; text-align: left; max-width: 100%; }
.btn.read small, .rd-nav small { font-weight: 500; font-size: 12.5px; opacity: .8; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.reader { max-width: 760px; }
.reader .lesson { max-width: none; }
.rd-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 0 8px; }
.rdc { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 5px 12px; font-weight: 600; font-size: 13.5px; color: var(--muted); }
.rdc.on { background: var(--t, var(--blue)); border-color: var(--t, var(--blue)); color: #fff; }
.rd-pos { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); margin: 2px 0 12px; }
.rd-pos .bar { flex: 1; }
.readtag { color: var(--good); font-weight: 700; }
.rd-nav { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; margin: 18px -10px 6px; padding: 8px; position: sticky; bottom: calc(8px + var(--tabs-h, 0px)); z-index: 5;
  background: rgba(255,255,255,.94); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-radius: 14px; box-shadow: 0 4px 18px rgba(17,28,38,.12); }
.rd-nav .btn { padding: 10px 16px; font-size: 15.5px; margin: 0; width: auto; }
.rd-nav .btn.primary { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; text-align: right; min-width: 0; }
.rd-nav .btn.primary small { max-width: 100%; }
.rd-more { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 10px; }
.badge.read { background: #e6f0fb; color: var(--blue); }
.pt small { font-size: 14px; font-weight: 600; margin-left: 8px; }
#toast { position: fixed; left: 50%; bottom: calc(24px + var(--tabs-h, 0px)); transform: translate(-50%, 20px); background: #1d2733; color: #fff; padding: 10px 18px; border-radius: 99px; font-weight: 600; opacity: 0; pointer-events: none; transition: .25s; z-index: 50; white-space: nowrap; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 700px) {
  .hero-btns { flex-direction: column; }
  .hero-btns .btn { width: 100%; margin: 0; }
  .rd-chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -4px; padding: 2px 4px 8px; }
  .rd-chips::-webkit-scrollbar { display: none; }
  .rdc span { display: none; }
  .rdc { padding: 4px 10px; font-size: 17px; }
  .reader .lesson { padding: 18px 16px; }
  .rd-nav { margin: 14px -10px 0; padding: 6px; grid-template-columns: 52px minmax(0, 1fr); border-radius: 12px; }
  .rd-nav .btn { padding: 7px 12px; font-size: 15px; border-radius: 9px; }
  .rd-nav .btn span { display: none; }
  .rd-nav small { font-size: 11.5px; }
}
.lib-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: -6px 0 18px; }
.lib-top .muted { font-size: 14px; }

/* numéro de version (lu dans __init__.py au build) */
.ver { display: inline-block; margin-left: 7px; padding: 1px 6px; border-radius: 6px; background: rgba(255,255,255,.18); color: #fff; font-size: 11px; font-weight: 600; letter-spacing: .02em; vertical-align: middle; white-space: nowrap; }

/* tuiles : lecture du mot (coupée par défaut) et barre du mot sélectionné, compacte */
.tilehead { position: relative; }
.tspeak { position: absolute; top: 10px; right: 12px; width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255,255,255,.45); background: rgba(255,255,255,.18); font-size: 18px; line-height: 1; padding: 0; }
.tspeak[aria-pressed="true"] { background: #fff; }
.tilebar { padding: 8px 10px; margin: 8px 0; display: grid; gap: 6px; }
.tb-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tb-w { font-weight: 700; font-size: 17px; white-space: nowrap; }
.tb-fr { flex: 1; min-width: 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tilebar .play { width: 28px; height: 28px; font-size: 11px; }
.tb-info { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.tb-acts { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 6px; }
.tb-acts:not(:has(.reset)) { grid-template-columns: 1fr 1fr 1fr; }
.tb-btn { border: 1px solid var(--line); background: #fff; border-radius: 9px; padding: 6px 4px; font: inherit; font-size: 13.5px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.tb-btn.learn.on { background: #F5B800; border-color: #F5B800; color: #3d2f00; }

<script>const CG = { themes: [], words: [] };
/* Aides pour écrire le contenu : V(suédois, français, note?) = un mot ou une phrase à retenir. */
const V = (sv, fr, note) => ({ sv, fr, note: note || '' });
/* Q(question, bonne réponse, [3 leurres], explication?, options?) = une carte écrite à la main.
   options : { asv } texte suédois lu à voix haute après la réponse, { qsv } texte suédois lu à la question, { type: true } réponse à taper en rappel. */
const Q = (q, a, d, x, o) => Object.assign({ q, a, d, x: x || '' }, o || {});
/* P(suédois, français, note?) = phrase complète : donne un exercice « remets dans l'ordre / traduis » et une dictée. */
const P = (sv, fr, note) => ({ sv, fr, note: note || '' });
/* Z(phrase avec ___, mot attendu, traduction française, [3 leurres], explication?) = phrase à trous (choix, puis à taper dès la boîte 3). */
const Z = (s, a, fr, d, x) => ({ s, a, fr, d, x: x || '' });

/* W('texte') = un mot écrit en une ligne, séparé par | :
   nom      W('en bil|bilar|voiture|note?')      (en ou ett, pluriel indéfini, français, note)
   verbe    W('v prata|pratar|pratade|pratat|parler|note?')   (infinitif, présent, prétérit, supin, français)
   autre    W('snabb|rapide|note?')
   Donne {sv, fr, note, g ('en'|'ett'|''), pl, forms ('pratar · pratade · pratat')}. */
const W = s => {
  const p = s.split('|').map(x => x.trim()); let m;
  if ((m = /^(en|ett) (.+)$/.exec(p[0]))) return { sv: m[2], g: m[1], pl: p[1] || '', fr: p[2], note: p[3] || '', forms: '' };
  if ((m = /^v (.+)$/.exec(p[0]))) return { sv: m[1], g: '', pl: '', fr: p[4], note: p[5] || '', forms: p[1] + ' · ' + p[2] + ' · ' + p[3] };
  return { sv: p[0], g: '', pl: '', fr: p[1], note: p[2] || '', forms: '', plain: true };   /* plain : ni genre ni formes ajoutés (adjectif, adverbe, pronom, phrase…) */
};
/* T(titre, [colonnes], [[ligne], …], note?) = un tableau dans une fiche */
const T = (title, cols, rows, note) => ({ title, cols, rows, note: note || '' });
/* UP(id de fiche, { tables, pit, keys, text, vocab… }) = enrichit une fiche existante sans toucher à ses cartes ni à ses ids */
const UPGRADES = {};
const UP = (id, o) => { UPGRADES[id] = Object.assign(UPGRADES[id] || {}, o); };
/* GENDERS : « en bil|bilar » pour donner genre et pluriel à des mots déjà écrits sans article (clé = le mot) */
const GENDERS = {};
const GN = lines => lines.split('\n').forEach(l => { const p = l.trim().split('|'); const m = /^(en|ett) (.+)$/.exec(p[0] || ''); if (m) GENDERS[m[2]] = { g: m[1], pl: p[1] || '' }; });
/* VF : formes de verbes pour des mots déjà écrits sans formes (clé = l'infinitif) : « prata|pratar|pratade|pratat » */
const VERBFORMS = {};
const VF = lines => lines.split('\n').forEach(l => { const p = l.trim().split('|'); if (p.length === 4) VERBFORMS[p[0]] = p[1] + ' · ' + p[2] + ' · ' + p[3]; });

        `Les **verbes à particule** (verbe + petit mot comme **upp, ut, bort, på, in, till**) sont partout. Le sens est souvent idiomatique : **ta upp** (aborder un sujet), **ta bort** (supprimer), **komma på** (trouver une idée), **hålla på med** (être en train de). Le **verbe** et la **particule** se séparent ou se collent selon la phrase.`,

        `On dit aussi **till** pour l'échéance (**till fredag**), **efter** (après), **innan** (avant) et **medan** (pendant que). Pour les moments de la journée : **på morgonen, på kvällen, i morse, i kväll, i natt**.`

      text: [
        `Le suédois colle volontiers les mots : **arbets + plats = arbetsplats**. Le **genre** du mot composé est celui de son **dernier élément** : **ett hus + en dörr = en husdörr**. Entre les deux éléments, on trouve parfois une **lettre de liaison** : **-s** (**arbetsplats**), **-e** (**flickvän**), **-o** (**kvinnokläder**), ou rien (**bokhylla**).`,
        `Les **suffixes** fabriquent des familles de mots : **-het** (**ärlig → ärlighet**), **-ning** (**träna → träning**), **-else** (**känna → känsla**), **-dom** (**sjuk → sjukdom**), **-are** (**arbeta → arbetare**). Reconnaître ces suffixes aide à **deviner le genre** : **-het, -ning, -else, -are** → presque toujours **en**.`

/* SY Svenska : apprendre le suédois avec de courtes fiches et des cartes revues au bon moment (répétition espacée), voix suédoise. */
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const plural = (n, s, p) => n + ' ' + (n > 1 ? (p || s + 's') : s);

/* ---------------------------------------------------------------- données */
const svFull = v => v.g ? v.g + ' ' + v.sv : v.sv;                    /* « en bil » : le genre fait partie du mot */
const wordInfo = v => [v.g && v.pl ? 'Pluriel : ' + v.pl : '', v.forms ? 'Formes : ' + v.forms.replace(/ · /g, ', ') : '', v.note].filter(Boolean).join(' · ');
function fixWord(v) {
  const m = /^(en|ett) (.+)$/.exec(v.sv); if (m) { v.g = m[1]; v.sv = m[2]; }
  v.g = v.g || ''; v.pl = v.pl || ''; v.forms = v.forms || '';
  const g = GENDERS[v.sv];
  if (g && !v.plain && (!v.g || v.g === g.g) && !v.forms && !/\s/.test(v.sv) && (v.g || !v.pl)) { v.g = g.g; if (!v.pl) v.pl = g.pl; }
  if (!v.plain && !v.g && !v.forms && !v.pl && VERBFORMS[v.sv]) v.forms = VERBFORMS[v.sv];
  return v;
}
/* enrichissements de fiches existantes (tableaux, pièges, mots en plus) : les ids des cartes déjà faites ne bougent pas */
CG.themes.forEach(t => t.fiches.forEach(f => {
  const u = UPGRADES[f.id]; if (!u) return;
  ['tables', 'pit'].forEach(k => { if (u[k]) f[k] = (f[k] || []).concat(u[k]); });
  if (u.text) f.text = u.text; if (u.keys) f.keys = u.keys;
  [['vocabAdd', 'vocab'], ['phrasesAdd', 'phrases'], ['clozeAdd', 'cloze'], ['extraAdd', 'extra']].forEach(([a, k]) => { if (u[a]) f[k] = (f[k] || []).concat(u[a]); });
}));
/* compléments de lecture (data-more.js) : sections, pièges, lien vers la fiche Grammaire ; aucune carte ajoutée */
CG.themes.forEach(t => t.fiches.forEach(f => { const m = MORE[f.id]; if (!m) return; f.more = m.sec || []; f.gram = m.gram || ''; if (m.pit && m.pit.length) f.pit = (f.pit || []).concat(m.pit); }));
CG.themes.forEach(t => t.fiches.forEach(f => (f.vocab || []).forEach(fixWord)));
CG.words.forEach(w => w.words.forEach(fixWord));
const THEMES = CG.themes, FICHES = [], CARDS = {}, FBY = {}, TBY = {}, POOL = {};
THEMES.forEach(t => {
  TBY[t.id] = t; POOL[t.id] = []; t.lvl = t.lvl || (['pm', 'gr', 'vq', 'cu'].includes(t.id) ? 'A1' : 'A2');
  t.fiches.forEach(f => (f.vocab || []).forEach(v => POOL[t.id].push(v)));
});
/* faux pluriels plausibles pour le QCM (jamais le bon) */
function pluralDistractors(v) {
  const stem = /[aeiouyåäö]$/.test(v.sv) ? v.sv.slice(0, -1) : v.sv;
  const c = [v.sv + 'ar', v.sv + 'or', v.sv + 'er', stem + 'ar', stem + 'or', stem + 'er', v.sv + 'n', v.sv + 'r', v.sv, stem + 'en'].filter((x, i, a) => x !== v.pl && a.indexOf(x) === i);
  return shuffle(c).slice(0, 3);
}
function genCards(f) {
  const cards = [];
  (f.vocab || []).forEach((v, k) => {
    cards.push({ id: f.id + '-s' + k, kind: 'sv-fr', q: 'Que veut dire « ' + svFull(v) + ' » ?', qsv: v.sv, a: v.fr, pool: 'fr', v, x: wordInfo(v) });
    cards.push({ id: f.id + '-f' + k, kind: 'fr-sv', q: 'Comment dit-on « ' + v.fr + ' » en suédois ?', qsub: v.g ? 'avec l\'article en ou ett' : '', a: svFull(v), asv: v.sv, type: true, pool: 'sv', v, x: wordInfo(v) });
    if (v.g) cards.push({ id: f.id + '-g' + k, kind: 'gender', q: '« ' + v.sv + ' » (' + v.fr + ') : en ou ett ?', a: v.g, d: [v.g === 'en' ? 'ett' : 'en'], asv: v.sv, v, x: svFull(v) + (v.pl ? ' → ' + v.pl : '') + (v.note ? ' · ' + v.note : '') });
    if (v.g && v.pl) cards.push({ id: f.id + '-p' + k, kind: 'plural', q: 'Pluriel de « ' + svFull(v) + ' » (' + v.fr + ') ?', a: v.pl, d: pluralDistractors(v), asv: v.pl, type: true, v, x: svFull(v) + ' → ' + v.pl });
    if (v.forms) cards.push({ id: f.id + '-t' + k, kind: 'forms', q: 'Les formes de « ' + v.sv + ' » (' + v.fr + ')', qsub: 'présent · prétérit · supin', a: v.forms.replace(/ · /g, ', '), asv: v.sv, v, x: v.note || '' });
  });
  (f.extra || []).forEach((c, j) => cards.push(Object.assign({ id: f.id + '-c' + j, kind: 'custom' }, c)));
  (f.phrases || []).forEach((p, k) => {
    cards.push({ id: f.id + '-o' + k, kind: 'order', q: 'Traduis en suédois', qfr: p.fr, a: p.sv, asv: p.sv, type: true, x: p.note || '' });
  });
  (f.cloze || []).forEach((z, j) => cards.push({ id: f.id + '-z' + j, kind: 'cloze', q: z.s, qfr: z.fr, a: z.a, d: z.d, x: z.x, asv: z.s.replace('___', z.a), type: true }));
  cards.forEach(c => { c.fiche = f; CARDS[c.id] = c; });
  f.cards = cards;
}
THEMES.forEach(t => t.fiches.forEach((f, i) => { f.theme = t; f.index = i; FBY[f.id] = f; FICHES.push(f); genCards(f); }));
/* mots en tuiles (façon Nemo) : un jeu de cartes par thème de mots, hors parcours des fiches */
const WSETS = CG.words.map(w => { const id = 'w' + w.id, f = { id, title: w.name, vocab: w.words, theme: { id, name: w.name, icon: w.icon, color: w.color }, isSet: true }; genCards(f); f.cards.forEach(c => { c.w = true; }); return f; });
const WBY = {}; WSETS.forEach(w => { WBY[w.id] = w; POOL[w.id] = w.vocab; });

/* ordre d'apprentissage : 1re fiche de chaque thème, puis 2e de chaque thème, etc. */
const LVLS = ['A1', 'A2', 'B1', 'B2', 'C1'];
const ORDER = []; LVLS.forEach(L => { for (let i = 0; i < 30; i++) THEMES.forEach(t => { if (t.lvl === L && t.fiches[i]) ORDER.push(t.fiches[i]); }); });
/* ordre des cartes d'une fiche neuve : suédois → français, puis genre / cartes écrites à la main, puis pluriels et formes, puis français → suédois */
const KR = { 'sv-fr': 0, custom: 1, cloze: 1, gender: 1, plural: 2, forms: 2, order: 3, 'fr-sv': 3 };
const newOrder = cards => cards.map((c, i) => [c, i]).sort((a, b) => (KR[a[0].kind] - KR[b[0].kind]) || (a[1] - b[1])).map(x => x[0]);

/* leurres : mots du même thème (jamais la bonne réponse) */
function choicesOf(c) {
  if (c.d) return shuffle([c.a].concat(c.d));
  const field = c.pool, val = v => field === 'sv' ? svFull(v) : v[field];
  const pool = POOL[c.fiche.theme.id].map(val).filter((x, i, a) => x !== c.a && a.indexOf(x) === i);
  let all = pool.length >= 3 ? pool : FICHES.reduce((s, f) => s.concat((f.vocab || []).map(val)), []).filter((x, i, a) => x !== c.a && a.indexOf(x) === i);
  return shuffle([c.a].concat(shuffle(all.slice()).slice(0, 3)));
}

/* ---------------------------------------------------------------- répétition espacée (Leitner, comme SY Culture) */
const INTERVALS = [0, 1, 3, 7, 14, 30, 60, 120];   /* jours d'attente selon la boîte */
const MASTER = 4;                                  /* boîte à partir de laquelle un exercice est « ancrée » */
const RECALL = 3;                                  /* à partir de la boîte 3 : rappel libre (taper ou se noter) au lieu du QCM */
const KEY = 'sy-svenska.v1';
let S = (() => { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.cards) return s; } catch (e) { /* ignoré */ } return null; })()
  || { cards: {}, fiches: {}, days: {}, opts: {}, tiles: {} };
S.tiles = S.tiles || {}; S.tmod = S.tmod || {};
Object.keys(S.tiles).forEach(k => { if (!S.tmod[k]) S.tmod[k] = 1; });   /* tuiles marquées avant 0.9.2 : transmises aux autres appareils qui ne les ont pas */
S.opts = Object.assign({ maxReviews: 30, alwaysChoice: false, autoSpeak: false, rate: 0.85, voice: '' }, S.opts);
S.lu = S.lu || {};   /* fiches lues (lecture libre, sans exercices) : id → jour */
if (!S.opts.v5) { S.opts.v5 = 1; S.opts.autoSpeak = false; }   /* 0.5 : plus de lecture automatique (la voix ne marche pas partout) */
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignoré */ } if (typeof ghSoon === 'function') ghSoon(); };
const dayNum = d => { d = d || new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 864e5); };
const dayIso = n => new Date(n * 864e5).toISOString().slice(0, 10);
const today = () => dayNum();
const st = id => S.cards[id];
const ficheStarted = f => f.cards.some(c => st(c.id)) || !!S.fiches[f.id];
const ficheMastery = f => f.cards.length ? f.cards.filter(c => st(c.id) && st(c.id).b >= MASTER).length / f.cards.length : 0;
const ficheSeen = f => f.cards.filter(c => st(c.id)).length;
const isRead = f => !!(S.lu && S.lu[f.id]);
function markRead(f) { S.lu = S.lu || {}; if (!S.lu[f.id]) { S.lu[f.id] = today(); save(); } }
function ficheStatus(f) {
  if (!ficheStarted(f)) return isRead(f) ? { cls: 'read', label: '✓ Lue' } : { cls: 'new', label: 'À découvrir' };
  const m = ficheMastery(f);
  if (m >= 1) return { cls: 'done', label: 'Acquise' };
  return { cls: 'wip', label: 'En cours · ' + Math.round(m * 100) + ' %' };
}
function dueCards() {
  const t = today();
  return Object.keys(S.cards).filter(id => CARDS[id] && S.cards[id].due <= t).sort((a, b) => S.cards[a].due - S.cards[b].due || S.cards[a].b - S.cards[b].b);
}
const nextNewFiche = () => ORDER.find(f => !ficheStarted(f)) || null;
/* fiches nouvelles du jour : de quoi remplir une séance de 10-15 min (≈ 18 cartes), au plus 2 fiches */
function plannedLessons(nReviews, extra) {
  const out = [], todo = ORDER.filter(f => !ficheStarted(f) && (S.lu || {})[f.id] !== today());   /* « lire seulement » aujourd'hui : pas reproposée avant demain */
  let cards = nReviews;
  for (const f of todo) {
    if (out.length >= 2) break;
    if (!extra && (cards >= 18 || nReviews >= 20)) break;
    if (!extra && out.length && cards + f.cards.length > 34) break;   /* séance raisonnable : pas de 2e fiche si elle la fait trop grossir */
    out.push(f); cards += f.cards.length;
    if (extra) break;
  }
  return out;
}
function grade(id, ok, practice) {
  const t = today(), s = S.cards[id] || { b: 0, due: t, n: 0, ok: 0 };
  s.n++; if (ok) s.ok++; delete s.known;
  if (ok) { if (!practice || s.b === 0) { s.b = Math.min(s.b + 1, INTERVALS.length - 1); s.due = t + INTERVALS[s.b]; } }
  else { s.b = 1; s.due = t + 1; }
  s.last = t; S.cards[id] = s;
  /* tuile : bleu foncé (niveau 6) = connu ; si une erreur la fait redescendre, elle redevient « à apprendre » */
  const m = /^(w[a-z0-9]+)-[sfgpt](\d+)$/.exec(id);
  if (m && WBY[m[1]] && ['learn', 'known'].includes(S.tiles[m[1] + '-' + m[2]])) S.tiles[m[1] + '-' + m[2]] = tileLevel(WBY[m[1]], +m[2]) === 6 ? 'known' : 'learn';
  const d = S.days[dayIso(t)] || { n: 0, ok: 0 }; d.n++; if (ok) d.ok++; S.days[dayIso(t)] = d;
  save();
}
function streak() {
  let n = 0, d = today();
  if (!S.days[dayIso(d)]) d--;          /* la série tient encore si on n'a pas encore travaillé aujourd'hui */
  while (S.days[dayIso(d)]) { n++; d--; }

  const k = arg.i, q = LTEST[k];
  const isGap = /___/.test(q.q);
  return '<div class="sess" style="--t:#B4521E"><div class="sess-top"><button class="link" data-nav="stats">✕ Arrêter</button>' + bar(k / LTEST.length, '#B4521E') + '<span class="muted">' + (k + 1) + ' / ' + LTEST.length + '</span></div>' +
    '<div class="qcard"><p class="eyebrow">🎯 Test de niveau</p><h2 class="q">' + (isGap ? esc(q.q).replace('___', '<span class="blank">___</span>') : esc(q.q)) + '</h2>' +
    '<div class="choices">' + arg.ch[k].map((c, j) => '<button class="choice" data-lt="' + esc(c) + '"><kbd>' + (j + 1) + '</kbd><span>' + esc(c) + '</span></button>').join('') + '</div>' +
    '<p class="muted small ltskip"><button class="link" data-lt="?">Je ne sais pas</button></p></div></div>';
}
function ltestLevel(ans) {
  const sc = LVLN.map(L => LTEST.filter((q, i) => q.lvl === L && ans[i] === q.a).length);
  let lv = -1; for (let i = 0; i < LVLN.length; i++) { if (sc[i] >= 3) lv = i; else break; }
  return { sc, lv };
}
function ltestResult(arg) {
  const { sc, lv } = ltestLevel(arg.ans), name = lv < 0 ? 'Débutant (A1 en cours)' : LVLN[lv] + (lv < 4 ? ' (en route vers ' + LVLN[lv + 1] + ')' : '');
  if (!arg.saved) { S.opts.test = { day: today(), lv }; save(); arg.saved = true; }
  const nextL = LVLN[Math.min(lv + 1, 4)];
  const todo = ORDER.filter(f => f.theme.lvl === nextL && !ficheStarted(f) && !isRead(f)).slice(0, 4);
  const gram = [...new Set(LTEST.map((q, i) => q.g && arg.ans[i] !== q.a ? q.g : '').filter(Boolean))].map(id => GF.find(x => x.id === id)).filter(Boolean).slice(0, 5);
  let h = '<section class="hero end"><div><p class="eyebrow">🎯 Résultat du test</p><h1>Niveau estimé : ' + name + '</h1><div class="ltbars">' +
    LVLN.map((L, i) => '<div class="ltb"><span>' + L + '</span>' + bar(sc[i] / 4, sc[i] >= 3 ? '#2F7D6B' : '#B4521E') + '<span class="muted">' + sc[i] + ' / 4</span></div>').join('') + '</div>' +
    '<p class="lead">Un niveau compte comme acquis avec au moins 3 bonnes réponses sur 4 (et les niveaux en dessous aussi).</p>';
  if (gram.length) h += '<h3>Grammaire à revoir</h3><div class="tlist">' + gram.map(g => '<button class="trow gfrow" data-gf="' + g.id + '"><span class="tr-ico" style="background:#6E56CF">' + g.icon + '</span><b>' + esc(g.title) + '<small>' + esc(g.sub) + '</small></b><small></small></button>').join('') + '</div>';
  if (todo.length) h += '<h3>Fiches conseillées (' + nextL + ')</h3><div class="tlist">' + todo.map(f => '<button class="trow" data-fiche="' + f.id + '"><span class="tr-ico" style="background:' + f.theme.color + '">' + f.theme.icon + '</span><b>' + esc(f.title) + '<small>' + esc(f.theme.name) + '</small></b><small></small></button>').join('') + '</div>';
  h += '<div class="actions">' + (lv >= 0 ? '<button class="btn primary" data-act="lt-known" data-l="' + lv + '">Marquer les fiches jusqu\'à ' + LVLN[lv] + ' comme connues</button>' : '') + '<button class="btn" data-nav="home">Retour à l\'accueil</button><button class="btn" data-act="lt-again">Refaire le test</button></div>' +
    (lv >= 0 ? '<p class="muted small">« Marquer comme connues » place les exercices de ces fiches en révision éclair dans 10 à 30 jours, pour vérifier.</p>' : '') + '</div></section>';
  return h;
}
function ltestCard() {
  const t = S.opts.test;
  return '<div class="gxbox lt"><div><b>🎯 Test de niveau</b><small>' + (t ? 'Dernier résultat : ' + (t.lv < 0 ? 'débutant' : LVLN[t.lv]) + ' · ' + dayIso(t.day) : '20 questions, 5 minutes : de A1 à C1') + '</small></div><button class="btn primary" data-act="lt-start">' + (t ? 'Refaire' : 'Faire le test') + '</button></div>';
}

/* --- évènements */
document.addEventListener('click', e => {
  const sp = e.target.closest('[data-ts]');
  if (sp) { const fr = document.querySelector('[data-tf="' + sp.dataset.ts + '"]'); if (fr) { fr.classList.toggle('on'); sp.classList.toggle('on'); } e.stopImmediatePropagation(); return; }
  const b = e.target.closest('button'); if (!b) return;
  const stop = () => e.stopImmediatePropagation();
  if (b.dataset.gx) { const f = GXBY[b.dataset.gx]; setSession(f.cards, f.cards.length, f.title); stop(); return; }
  if (b.dataset.vx) { setSession(VCARDS, 8, 'Verbes irréguliers'); stop(); return; }
  if (b.dataset.vxg != null) { const f = VSETS[+b.dataset.vxg]; setSession(f.cards, 8, f.title); stop(); return; }
  if (b.dataset.tx != null) { if (b.dataset.txdone) txMarkRead(b.dataset.txdone); go('texts', b.dataset.tx ? { id: b.dataset.tx } : {}); window.scrollTo(0, 0); stop(); return; }
  if (b.dataset.act === 'txall') { S.opts.txAll = !S.opts.txAll; save(); const y = window.scrollY; render(); window.scrollTo(0, y); stop(); return; }
  if (b.dataset.txa != null) {
    const a = view.arg; a.ans = a.ans || {}; if (a.ans[b.dataset.txa] != null) return; a.ans[b.dataset.txa] = b.dataset.v;
    if (Object.keys(a.ans).length === TBYID[a.id].qs.length) txMarkRead(a.id);
    const y = window.scrollY; render(); window.scrollTo(0, y); stop(); return;
  }
  if (b.dataset.act === 'lt-start' || b.dataset.act === 'lt-again') { go('ltest', {}); stop(); return; }
  if (b.dataset.lt != null && view.name === 'ltest') { const a = view.arg; a.ans[a.i] = b.dataset.lt; a.i++; render(); window.scrollTo(0, 0); stop(); return; }
  if (b.dataset.act === 'lt-known') {
    const lv = +b.dataset.l; THEMES.filter(t => LVLN.indexOf(t.lvl) <= lv).forEach(t => t.fiches.forEach(markKnown));
    S.opts.level = S.opts.level || 'test'; save(); toast('Fiches jusqu\'à ' + LVLN[lv] + ' marquées comme connues'); go('home'); stop(); return;
  }
  if (b.dataset.dadd != null) {
    const d = DICT[+b.dataset.dadd], t = today();
    ['s', 'f'].forEach(x => { const id = d.ref[0] + '-' + x + d.ref[1]; if (CARDS[id] && !S.cards[id]) S.cards[id] = { b: 0, due: t, n: 0, ok: 0, last: t }; });
    save(); toast('Ajouté : il revient dans ta séance du jour'); dRefresh(true); stop(); return;
  }
}, true);
/* sur un clavier : 1-4 pour répondre au test de niveau */
document.addEventListener('keydown', e => {
  if (view.name !== 'ltest' || !/^[1-4]$/.test(e.key)) return;
  const c = document.querySelectorAll('.choice[data-lt]')[+e.key - 1]; if (c) { c.click(); e.preventDefault(); }
});

/* Synchro GitHub (PC + iPhone) : même principe que SY Culture. La progression est rangée dans le gist secret
   « SY Culture : progression (ne pas supprimer) », dans un fichier à part (svenska.json). Jeton « gist » collé une fois par appareil. */
var GH = (() => { try { return Object.assign({ token: '', gist: '' }, JSON.parse(localStorage.getItem('sy-svenska-gh')) || {}); } catch (e) { return { token: '', gist: '' }; } })();
GH.busy = false; GH.timer = null; GH.state = ''; GH.lastOk = 0;
const GH_DESC = 'SY Culture : progression (ne pas supprimer)', GH_FILE = 'svenska.json';
const ghSave = () => { try { localStorage.setItem('sy-svenska-gh', JSON.stringify({ token: GH.token, gist: GH.gist, lastOk: GH.lastOk })); } catch (e) { /* ignoré */ } };
/* pas de jeton propre : on reprend celui de SY Culture (même navigateur / même iPhone) */
if (!GH.token) { try { const c = JSON.parse(localStorage.getItem('sy-culture-gh')); if (c && c.token) { GH.token = c.token; ghSave(); } } catch (e) { /* ignoré */ } }
const ghApi = (path, opt) => fetch('https://api.github.com' + path, Object.assign({ cache: 'no-store' }, opt || {}, {
  headers: Object.assign({ Authorization: 'Bearer ' + GH.token, Accept: 'application/vnd.github+json' }, opt && opt.body ? { 'Content-Type': 'application/json' } : {})
}));
/* fusion : carte par carte (la plus récemment travaillée gagne), jours au max, tuiles : la dernière modification gagne */
function mergeS(a, b) {
  const m = JSON.parse(JSON.stringify(a)); m.cards = m.cards || {}; m.tiles = m.tiles || {}; m.tmod = m.tmod || {}; m.days = m.days || {}; m.fiches = m.fiches || {};
  Object.keys(b.cards || {}).forEach(id => { const x = m.cards[id], y = b.cards[id]; if (!x || (y.last || 0) > (x.last || 0) || ((y.last || 0) === (x.last || 0) && (y.n || 0) > (x.n || 0))) m.cards[id] = y; });
  Object.keys(b.days || {}).forEach(d => { const x = m.days[d], y = b.days[d]; if (!x || y.n > x.n) m.days[d] = y; });
  Object.keys(b.fiches || {}).forEach(f => { if (!m.fiches[f]) m.fiches[f] = b.fiches[f]; });
  if (a.lu || b.lu) { m.lu = Object.assign({}, b.lu, a.lu); Object.entries(b.lu || {}).forEach(([id, d]) => { if (m.lu[id] > d) m.lu[id] = d; }); }   /* fiches lues : réunion (1re lecture) */
  if (a.glu || b.glu) m.glu = Object.assign({}, b.glu, a.glu);
  if (a.tlu || b.tlu) m.tlu = Object.assign({}, b.tlu, a.tlu);   /* textes lus : réunion */   /* fiches de grammaire lues : réunion */
  const bt = b.tmod || {};
  Object.keys(bt).forEach(k => { if (!(m.tmod[k] >= bt[k])) { m.tmod[k] = bt[k]; if (b.tiles && b.tiles[k]) m.tiles[k] = b.tiles[k]; else delete m.tiles[k]; } });
  Object.keys(m.tmod).forEach(k => { if (!m.tiles[k] || m.tiles[k] === 'out') { const i = k.lastIndexOf('-'); ['s', 'f', 'g', 'p', 't'].forEach(x => { delete m.cards[k.slice(0, i) + '-' + x + k.slice(i + 1)]; }); } });
  if (b.daily && (!m.daily || b.daily.day > m.daily.day)) m.daily = b.daily;   /* mots du jour : le tirage le plus récent */
  m.opts = Object.assign({}, b.opts, m.opts); m.mod = Math.max(a.mod || 0, b.mod || 0);
  return m;
}
function ghBadge(state) {
  GH.state = state;
  const txt = { syncing: '🔄 Synchronisation…', ok: '☁️ Synchronisé', offline: '☁️ Hors ligne · enregistré ici', auth: '⚠️ Jeton GitHub refusé', error: '⚠️ Synchro en échec' }[state] || '';
  const hb = document.getElementById('syncb');
  if (hb) { hb.textContent = !GH.token ? '🔑' : state === 'syncing' ? '🔄' : state === 'auth' || state === 'error' ? '⚠️' : '☁️'; hb.className = 'syncb' + (state === 'syncing' ? ' spin' : '') + (state === 'auth' || state === 'error' ? ' warn' : ''); hb.title = GH.token ? (txt || 'Synchronisation') + (GH.lastOk ? ' · ' + new Date(GH.lastOk).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '') + ' · toucher pour synchroniser' : 'Synchro non activée : toucher pour coller le jeton'; }
  const s = document.getElementById('gh-status'); if (s) s.textContent = txt + (GH.lastOk ? ' · dernière synchro ' + new Date(GH.lastOk).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '');
}
async function ghFindOrCreate() {
  for (let page = 1; page <= 10; page++) {
    const r = await ghApi('/gists?per_page=100&page=' + page);
    if (r.status === 401 || r.status === 403) throw { code: 'auth' };
    if (!r.ok) throw { code: 'http' };
    const a = await r.json(), g = a.find(x => x.description === GH_DESC);
    if (g) return g.id;
    if (a.length < 100) break;
  }
  const c = await ghApi('/gists', { method: 'POST', body: JSON.stringify({ description: GH_DESC, public: false, files: { [GH_FILE]: { content: JSON.stringify(S) } } }) });
  if (c.status === 401 || c.status === 403) throw { code: 'auth' };
  if (!c.ok) throw { code: 'http' };
  return (await c.json()).id;
}
async function ghSync() {
  if (!GH.token || GH.busy) return;
  if (navigator.onLine === false) { ghBadge('offline'); return; }
  GH.busy = true; ghBadge('syncing');
  try {
    if (!GH.gist) { GH.gist = await ghFindOrCreate(); ghSave(); }
    const r = await ghApi('/gists/' + GH.gist);
    if (r.status === 404) { GH.gist = ''; ghSave(); throw { code: 'retry' }; }
    if (r.status === 401 || r.status === 403) throw { code: 'auth' };
    if (!r.ok) throw { code: 'http' };
    const g = await r.json(), f = g.files && g.files[GH_FILE];
    let remote = null, txt = '';
    if (f) { txt = f.truncated ? await (await fetch(f.raw_url, { cache: 'no-store' })).text() : f.content; try { remote = JSON.parse(txt); } catch (e) { remote = null; } }
    if (remote && remote.cards) {
      const merged = mergeS(S, remote);
      if (JSON.stringify(merged) !== JSON.stringify(S)) {
        S = merged; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignoré */ }
        if (['home', 'library', 'theme', 'fiche', 'stats', 'tiles', 'words'].includes(view.name)) { const y = window.scrollY, ae = document.activeElement; if (!(ae && ae.tagName === 'INPUT')) { render(); window.scrollTo(0, y); } }
      }
    }
    const mine = JSON.stringify(S);
    if (mine !== txt) {
      const p = await ghApi('/gists/' + GH.gist, { method: 'PATCH', body: JSON.stringify({ files: { [GH_FILE]: { content: mine } } }) });
      if (p.status === 401 || p.status === 403) throw { code: 'auth' };
      if (!p.ok) throw { code: 'http' };
    }
    GH.lastOk = Date.now(); ghSave(); ghBadge('ok');
  } catch (e) {
    ghBadge(e && e.code === 'auth' ? 'auth' : (navigator.onLine === false || !e || !e.code) ? 'offline' : 'error');
    if (e && e.code === 'retry') setTimeout(ghSync, 2000);
  }
  GH.busy = false;
}
function ghSoon(ms) { if (!GH.token) return; clearTimeout(GH.timer); GH.timer = setTimeout(ghSync, ms == null ? 20000 : ms); }
function ghFlush() {
  if (!GH.token || !GH.gist || navigator.onLine === false) return;
  const mine = JSON.stringify(S); if (GH.flushed === mine) return; GH.flushed = mine;
  try { ghApi('/gists/' + GH.gist, { method: 'PATCH', keepalive: mine.length < 60000, body: JSON.stringify({ files: { [GH_FILE]: { content: mine } } }) }).catch(() => {}); } catch (e) { /* ignoré */ }
}
function ghStart() {
  if (!GH.token || GH.started) return; GH.started = true;
  setTimeout(ghSync, 800); setInterval(ghSync, 5 * 60 * 1000);
  window.addEventListener('online', () => ghSoon(1000));
  window.addEventListener('offline', () => ghBadge('offline'));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') ghFlush(); else ghSoon(500); });
  window.addEventListener('pagehide', ghFlush);
}
function ghPanel() {
  if (GH.token) return '<div class="ghp"><p><b>Synchro GitHub : activée</b> <span class="muted" id="gh-status"></span></p><p class="muted small">Même jeton que SY Culture. À l\'ouverture, toutes les 5 minutes, après tes réponses et à la fermeture.</p>' +
    '<p><button class="btn sm" data-act="gh-now">Synchroniser maintenant</button> <button class="link" data-act="gh-off">Retirer le jeton de cet appareil</button></p></div>';
  return '<div class="ghp"><p><b>Synchro GitHub (PC ↔ iPhone)</b> : colle ton jeton GitHub (<code>ghp_…</code>, droit « gist » seulement, le même que pour SY Culture). Il reste sur cet appareil.</p>' +
    '<p class="ghrow"><input id="gh-token" type="password" autocomplete="off" spellcheck="false" placeholder="ghp_…"> <button class="btn primary sm" data-act="gh-save">Activer</button></p></div>';
}
async function ghActivate() {
  const v = ($('gh-token') || {}).value ? $('gh-token').value.trim() : '';
  if (!/^(ghp_|github_pat_)[A-Za-z0-9_]{20,}$/.test(v)) { alert('Ce n\'est pas un jeton GitHub (il commence par ghp_).'); return; }
  GH.token = v; GH.gist = ''; GH.lastOk = 0; ghSave();
  /* un seul jeton pour toutes les pages (Culture, France, Monde, Svenska) */
  try { const c = JSON.parse(localStorage.getItem('sy-culture-gh')) || {}; if (!c.token) localStorage.setItem('sy-culture-gh', JSON.stringify({ token: v, gist: '' })); } catch (e) { /* ignoré */ }
  await ghSync();
  if (GH.state === 'auth') { GH.token = ''; ghSave(); alert('GitHub refuse ce jeton : vérifie qu\'il a bien la case « gist ».'); }
  else ghStart();
  render();
}
ghStart();
ghBadge(GH.token ? 'ok' : '');
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'gh-box') { if (GH.token) ghSync(); else { go('stats'); setTimeout(() => { const x = document.getElementById('sync-sec'); if (x) x.scrollIntoView({ block: 'start' }); const i = document.getElementById('gh-token'); if (i) i.focus(); }, 50); } }
  else if (a === 'gh-now') ghSync();
  else if (a === 'gh-save') ghActivate();
  else if (a === 'gh-off' && confirm('Retirer le jeton GitHub de cet appareil ? Ta progression reste ici et sur GitHub.')) { GH.token = ''; GH.gist = ''; ghSave(); ghBadge(''); render(); }
});

/* le menu SY Culture (page parente) demande l'état ou une synchro */
window.addEventListener('message', async e => {
  const d = e.data; if (!d || d.sy !== 'ask') return;
  if (d.act === 'sync') await ghSync();
  try { e.source.postMessage({ sy: 'state', state: GH.token ? (GH.state || (GH.lastOk ? 'ok' : 'syncing')) : 'notoken', lastOk: GH.lastOk }, '*'); } catch (x) { /* ignoré */ }
});

/* Démarrage : après tous les modules. */
render();
window.__sv = { S: () => S, go, startSession, CARDS, FICHES, today, grade, dueCards, sess: () => sess, speak };
</script>
